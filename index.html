<style>

  --border: #e7e5e4;
  --accent: #475569;
  --business: #b45309;
  --global: #15803d;
  --happiness: #e11d48;
  --parenting: #2563eb;
  --review: #7c3aed;
  --link: #2563eb;
  --primary-btn-bg: #1c1917;
  --primary-btn-fg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131110;
    --card-bg: #201d1b;
    --fg: #f3f2f0;
    --muted: #9c9691;
    --border: #35302c;
    --accent: #94a3b8;
    --business: #f0b862;

    --happiness: #fb7185;
    --parenting: #93c5fd;
    --review: #c4b5fd;
    --link: #93c5fd;
    --primary-btn-bg: #f3f2f0;
    --primary-btn-fg: #1c1917;
  }
}
:root[data-theme="dark"] {
  --bg: #131110;
  --card-bg: #201d1b;
  --fg: #f3f2f0;
  --muted: #9c9691;
  --border: #35302c;
  --accent: #94a3b8;
  --business: #f0b862;
  --global: #4ade80;
  --happiness: #fb7185;
  --parenting: #93c5fd;
  --review: #c4b5fd;
  --link: #93c5fd;
  --primary-btn-bg: #f3f2f0;
  --primary-btn-fg: #1c1917;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  line-height: 1.7;
  overflow-x: hidden;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
}
h1 {
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  font-size: 1.05rem;
  margin: 0 0 8px;
}
.nav-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-row select {
  flex: 1;
  min-width: 0;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--fg);
  font-size: 0.95rem;
}
.nav-row button {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--fg);
  font-size: 0.95rem;
  white-space: nowrap;
}
.nav-row button:disabled { opacity: 0.4; }
main {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px;
}
.post {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-left: 5px solid var(--accent);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.post.cat-business { border-left-color: var(--business); }
.post.cat-global { border-left-color: var(--global); }
.post.cat-happiness { border-left-color: var(--happiness); }
.post.cat-parenting { border-left-color: var(--parenting); }
.post.cat-review { border-left-color: var(--review); }
.badges { margin-bottom: 6px; }
.badge {
  display: inline-block;
  font-size: 0.72rem;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 1px 8px;
  margin-right: 4px;
}
.hook {
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  font-weight: 700;
  font-size: 1.05rem;
  margin: 0 0 8px;
}
.body-text {
  white-space: pre-wrap;
  word-break: break-word;
  margin: 0 0 10px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}
.actions button, .actions a {
  display: inline-block;
  text-decoration: none;
  font-size: 0.85rem;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--fg);
  background: var(--bg);
}
.actions .primary {
  background: var(--primary-btn-bg);
  color: var(--primary-btn-fg);
  border-color: var(--primary-btn-bg);
}
.meta-line {
  font-size: 0.8rem;
  color: var(--muted);
  margin: 2px 0;
}
details.runners-up {
  margin: 8px 0 24px;
  font-size: 0.85rem;
  color: var(--muted);
}
details.runners-up ul { padding-left: 1.2em; }
details.runners-up a { color: var(--link); }
footer {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px;
  color: var(--muted);
  font-size: 0.8rem;
}
noscript { display: block; padding: 16px; }
@media (max-width: 400px) {
  main, footer { padding: 16px; }
}
</style>

予防の減薬を「どの薬から」優先すべきかを示しており、在宅の薬の見直しに直結する"}, {"id": "2026-09-23-3", "n": 3, "category": "medical", "badges": ["🔍深掘り候補"], "body": "【目が見えにくい人は、せん妄のオッズが約2倍!?】\n\n視力障害とせん妄の関連を調べた系統的レビュー・メタ解析(44研究、26,230人)。さまざまな診療の場の成人が対象。\n\n・多変量調整した16研究の統合：視力障害があるとせん妄のオッズ比2.02(95%CI 1.29-3.16、I²=82.8%)\n・未調整の推定値も含めた解析ではOR 2.40(1.81-3.18)\n・診療の場による差は、メタ回帰では有意でなかった\n・エビデンスの確実性は「低」\n\n⚠️限界：観察研究のみで因果関係は示せない。視力障害・せん妄の定義がまちまちで、研究間のばらつきが大きい。視力を矯正すればせん妄が減るかは検証されていない。\n\n🏠在宅医の一言：入院やショートステイの前に「眼鏡を持っていくか」を確かめるのは、手間もリスクも小さい。予防効果は未証明だが、せん妄のハイリスク者を見分ける目印にはなりそう。\n\n📄 J Gen Intern Med 2026 DOI:10.1007/s11606-026-10804-w\n#総合内科 #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E7%9B%AE%E3%81%8C%E8%A6%8B%E3%81%88%E3%81%AB%E3%81%8F%E3%81%84%E4%BA%BA%E3%81%AF%E3%80%81%E3%81%9B%E3%82%93%E5%A6%84%E3%81%AE%E3%82%AA%E3%83%83%E3%82%BA%E3%81%8C%E7%B4%842%E5%80%8D%21%3F%E3%80%91%0A%0A%E8%A6%96%E5%8A%9B%E9%9A%9C%E5%AE%B3%E3%81%A8%E3%81%9B%E3%82%93%E5%A6%84%E3%81%AE%E9%96%A2%E9%80%A3%E3%82%92%E8%AA%BF%E3%81%B9%E3%81%9F%E7%B3%BB%E7%B5%B1%E7%9A%84%E3%83%AC%E3%83%93%E3%83%A5%E3%83%BC%E3%83%BB%E3%83%A1%E3%82%BF%E8%A7%A3%E6%9E%90%2844%E7%A0%94%E7%A9%B6%E3%80%8126%2C230%E4%BA%BA%29%E3%80%82%E3%81%95%E3%81%BE%E3%81%96%E3%81%BE%E3%81%AA%E8%A8%BA%E7%99%82%E3%81%AE%E5%A0%B4%E3%81%AE%E6%88%90%E4%BA%BA%E3%81%8C%E5%AF%BE%E8%B1%A1%E3%80%82%0A%0A%E3%83%BB%E5%A4%9A%E5%A4%89%E9%87%8F%E8%AA%BF%E6%95%B4%E3%81%97%E3%81%9F16%E7%A0%94%E7%A9%B6%E3%81%AE%E7%B5%B1%E5%90%88%EF%BC%9A%E8%A6%96%E5%8A%9B%E9%9A%9C%E5%AE%B3%E3%81%8C%E3%81%82%E3%82%8B%E3%81%A8%E3%81%9B%E3%82%93%E5%A6%84%E3%81%AE%E3%82%AA%E3%83%83%E3%82%BA%E6%AF%942.02%2895%25CI%201.29-3.16%E3%80%81I%C2%B2%3D82.8%25%29%0A%E3%83%BB%E6%9C%AA%E8%AA%BF%E6%95%B4%E3%81%AE%E6%8E%A8%E5%AE%9A%E5%80%A4%E3%82%82%E5%90%AB%E3%82%81%E3%81%9F%E8%A7%A3%E6%9E%90%E3%81%A7%E3%81%AFOR%202.40%281.81-3.18%29%0A%E3%83%BB%E8%A8%BA%E7%99%82%E3%81%AE%E5%A0%B4%E3%81%AB%E3%82%88%E3%82%8B%E5%B7%AE%E3%81%AF%E3%80%81%E3%83%A1%E3%82%BF%E5%9B%9E%E5%B8%B0%E3%81%A7%E3%81%AF%E6%9C%89%E6%84%8F%E3%81%A7%E3%81% : "business", "badges": ["💼 📅"], "body": "【医師のリーダーシップ、「一人で引っぱる」から「チームで率いる」へ!?】\n\n2025年11月の研究ですが、医師に求められるリーダーシップ能力のモデルを整理したスコーピングレビュー(学術データベースと灰色文献を検索)。\n\n・一般的な医療リーダーシップ能力モデル16件と、特定の場面に絞った能力研究13件を特定\n・モデルの多くは北米・欧州発で、英国・米国・カナダ・スイスのモデルが特に広く使われている\n・この30年で、チーム単位・患者中心の「集合的リーダーシップ」へと重心が移ってきた\n・今後は文化的な感受性、危機管理、経営スキル、デジタルリテラシーが求められる\n\n⚠️限界：既存のモデルを整理した地図のような研究で、どの能力が患者や職場の成果を良くするかは検証していない。欧米中心で、日本の文脈への当てはめは別に考える必要がある。\n\n💼経営の一言：院長ひとりが全部を背負う形から、看護師・事務も含めて「みんなで率いる」形へ。経営や危機管理を院長だけの仕事にしない役割分担を考えたい。\n\n📄 BMJ Lead 2025 DOI:10.1136/leader-2024-001178\n#クリニック経営 #組織づくり", "x_href": "https://x.com/intent/post?text=%E3%80%90%E5%8C%BB%E5%B8%AB%E3%81%AE%E3%83%AA%E3%83%BC%E3%83%80%E3%83%BC%E3%82%B7%E3%83%83%E3%83%97%E3%80%81%E3%80%8C%E4%B8%80%E4%BA%BA%E3%81%A7%E5%BC%95%E3%81%A3%E3%81%B1%E3%82%8B%E3%80%8D%E3%81%8B%E3%82%89%E3%80%8C%E3%83%81%E3%83%BC%E3%83%A0%E3%81%A7%E7%8E%87%E3%81%84%E3%82%8B%E3%80%8D%E3%81%B8%21%3F%E3%80%91%0A%0A2025%E5%B9%B411%E6%9C%88%E3%81%AE%E7%A0%94%E7%A9%B6%E3%81%A7%E3%81%99%E3%81%8C%E3%80%81%E5%8C%BB%E5%B8%AB%E3%81%AB%E6%B1%82%E3%82%81%E3%82%89%E3%82%8C%E3%82%8B%E3%83%AA%E3%83%BC%E3%83%80%E3%83%BC%E3%82%B7%E3%83%83%E3%83%97%E8%83%BD%E5%8A%9B%E3%81%AE%E3%83%A2%E3%83%87%E3%83%AB%E3%82%92%E6%95%B4%E7%90%86%E3%81%97%E3%81%9F%E3%82%B9%E3%82%B3%E3%83%BC%E3%83%94%E3%83%B3%E3%82%B0%E3%83%AC%E3%83%93%E3%83%A5%E3%83%BC%28%E5%AD%A6%E8%A1%93%E3%83%87%E3%83%BC%E3%82%BF%E3%83%99%E3%83%BC%E3%82%B9%E3%81%A8%E7%81%B0%E8%89%B2%E6%96%87%E7%8C%AE%E3%82%92%E6%A4%9C%E7%B4%A2%29%E3%80%82%0A%0A%E3%83%BB%E4%B8%80%E8%88%AC%E7%9A%84%E3%81%AA%E5%8C%BB%E7%99%82%E3%83%AA%E3%83%BC%E3%83%80%E3%83%BC%E3%82%B7%E3%83%83%E3%83%97%E8%83%BD%E5%8A%9B%E3%83%A2%E3%83%87%E3%83%AB16%E4%BB%B6%E3%81%A8%E3%80%81%E7%89%B9%E5%AE%9A%E3%81%AE%E5%A0%B4%E9%9D%A2%E3%81%AB%E7%B5%9E%E3%81%A3%E3%81%9F%E8%83%BD%E5%8A%9B%E7%A0%94%E7%A9%B613%E4%BB%B6%E3%82%92%E7%89%B9%E5%AE%9A%0A%E3%83%BB%E3%83%A2%E3%83%87%E3%83%AB%E3%81%AE%E5%A4%9A%E3%81%8F%E3%81%AF%E5%8C%97%E7%B1%B3%E3%83%BB%E6%AC%A7%E5%B7%9E%E7%99%BA%E3%81%A7%E3%80%8 心のトレーニング」の組み合わせ!?】\n\n2026年1月の研究ですが、病気の診断のない成人を対象に、幸福度(ウェルビーイング)を高める介入を比べたRCTの系統的レビュー・ネットワークメタ解析(183試験、22,811人)。\n\n・ほとんどの介入が、何もしない対照より幸福度を改善\n・効果が最大だったのは、運動と心理的介入の組み合わせ(SMD 0.73、95%CI 0.27-1.20)\n・マインドフルネス、コンパッション、単独のポジティブ心理学介入、ヨガ、運動は、いずれも中等度で安定した効果(SMD 0.41〜0.49)で、互いに差はなし\n・自然に触れるプログラムは、対照と有意差なし(研究のばらつきが大きく、根拠は限定的)\n\n⚠️限界：バイアスリスクが中〜高の試験が多く、出版バイアスの可能性もある(感度分析では結論は変わらず)。検索は2023年3月まで。\n\n😊暮らしの一言：どれか1つの「正解」を探すより、続けやすいものを選べばよさそう。歩きながら良かったことを思い返すなど、体と心を組み合わせるとさらに効くかもしれない。\n\n📄 Nat Hum Behav 2026 DOI:10.1038/s41562-025-02369-1\n#ポジティブ心理学 #幸福学", "x_href": "https://x.com/intent/post?text=%E3%80%90%E5%B9%B8%E3%81%9B%E3%82%92%E9%AB%98%E3%82%81%E3%82%8B%E6%96%B9%E6%B3%95%E3%80%81%E3%81%84%E3%81%A1%E3%81%B0%E3%82%93%E5%8A%B9%E3%81%8F%E3%81%AE%E3%81%AF%E3%80%8C%E9%81%8B%E5%8B%95%EF%BC%8B%E5%BF%83%E3%81%AE%E3%83%88%E3%83%AC%E3%83%BC%E3%83%8B%E3%83%B3%E3%82%B0%E3%80%8D%E3%81%AE%E7%B5%84%E3%81%BF%E5%90%88%E3%82%8F%E3%81%9B%21%3F%E3%80%91%0A%0A2026%E5%B9%B41%E6%9C%88%E3%81%AE%E7%A0%94%E7%A9%B6%E3%81%A7%E3%81%99%E3%81%8C%E3%80%81%E7%97%85%E6%B0%97%E3%81%AE%E8%A8%BA%E6%96%AD%E3%81%AE%E3%81%AA%E3%81%84%E6%88%90%E4%BA%BA%E3%82%92%E5%AF%BE%E8%B1%A1%E3%81%AB%E3%80%81%E5%B9%B8%E7%A6%8F%E5%BA%A6%28%E3%82%A6%E3%82%A7%E3%83%AB%E3%83%93%E3%83%BC%E3%82%A4%E3%83%B3%E3%82%B0%29%E3%82%92%E9%AB%98%E3%82%81%E3%82%8B%E4%BB%8B%E5%85%A5%E3%82%92%E6%AF%94%E3%81%B9%E3%81%9FRCT%E3%81%AE%E7%B3%BB%E7%B5%B1%E7%9A%84%E3%83%AC%E3%83%93%E3%83%A5%E3%83%BC%E3%83%BB%E3%83%8D%E3%83%83%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF%E3%83%A1%E3%82%BF%E8%A7%A3%E6%9E%90%28183%E8%A9%A6%E9%A8%93%E3%80%8122%2C811%E4%BA%BA%29%E3%80%82%0A%0A%E3%83%BB%E3%81%BB%E3%81%A8%E3%82%93%E3%81%A9%E3%81%AE%E4%BB%8B%E5%85%A5%E3%81%8C%E3%80%81%E4%BD%95%E3%82%82%E3%81%97%E3%81%AA%E3%81%84%E5%AF%BE%E7%85%A7%E3%82%88%E3%82%8A%E5%B9%B8%E7%A6%8F%E5%BA%A6%E3%82%92%E6%94%B9%E5%96%84%0A%E3%83%BB%E5%8A%B9%E6%9E%9C%E3%81%8C%E6%9C%80%E5%A4%A7%E3%81%A0%E3%81%A3%E3%81%9F%E3%81%AE%E3%81%AF%E3%80%81%E9%81%8B%E5%8B%95%E3%81%A8%E5%BF%83%E7%90%86%E7%9A%84%E4%BB%8B : "Higher and Lower Intensity Outreach to Increase Enrollment in a Medicaid Food Is Medicine Program: A Randomized Controlled Trial.（J Gen Intern Med）", "url": "https://pubmed.ncbi.nlm.nih.gov/42768178/"}, {"title": "Implementation factors of group antenatal care in low-resource settings in Tanzania.（PLOS Glob Public Health）", "url": "https://pubmed.ncbi.nlm.nih.gov/42758772/"}, {"title": "Quantifying excess TB prevalence among people living with HIV on ART in the universal ART era.（PLOS Glob Public Health）", "url": "https://pubmed.ncbi.nlm.nih.gov/42766564/"}]}, "2026-09-22": {"label": "2026-09-22（火）・7本", "posts": [{"id": "2026-09-22-1", "n": 1, "category": "medical", "badges": [], "body": "【多因子転倒予防プログラム、「転ぶ人の割合」はほとんど減らせない!?】\n\n地域在住高齢者(60歳以上)を対象に、個々のリスク因子に応じて内容を変える「多因子介入」の効果を検証したコクランの系統的レビュー・メタ解析(110件のRCT、48,919人)。\n\n・多因子介入 vs 通常ケア/アテンションコントロール：転倒率は減少(RaR 0.76、95%CI 0.67-0.87)、再発転倒のリスクも減少(RR 0.87、0.78-0.98)\n・しかし「転倒する人の割合」自体にはほとんど効果なし(RR 0.95、0.90-1.01)\n・転倒予防のアドバイス/教育と比べると、多因子介入は転倒率をむしろ小幅に増やす可能性(RaR 1.09、1.00-1.18、中等度の確実性)\n\n⚠️限界：エビデンスの確実性の多くは低〜中等度で、研究間のばらつきが大きい(I²最大92%)。比較の組み合わせによって結論が異なる。\n\n🏠在宅医の一言：手厚い多因子介入でも「転ぶ人自体を減らす」のは簡単ではなさそう。目標を「転倒回数を減らす」のか「転ばない人を増やす」のか、家族と話すときに整理して伝えたい。\n\n📄 Cochrane Database Syst Rev 2026 DOI:10.1002/14651858.CD012221.pub3\n#総合内科 #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E5%A4%9A%E5%9B%A0%E5%AD%90%E8%BB%A2%E5%80%92%E4%BA%88%E9%98%B2%E3%83%97%E3%83%AD%E3%82%B0%E3%83%A9%E3%83%A0%E3%80%81%E3%80%8C%E8%BB%A2%E3%81%B6%E4%BA%BA%E3%81%AE%E5%89%B2%E5%90%88%E3%80%8D%E3%81%AF%E3%81%BB%E3%81%A8%E3%82%93%E3%81%A9%E6%B8%9B%E3%82%89%E3%81%9B%E3%81%AA%E3%81%84%21%3F%E3%80%91%0A%0A%E5%9C%B0%E5%9F%9F%E5%9C%A8%E4%BD%8F%E9%AB%98%E9%BD%A2%E8%80%85%2860%E6%AD%B3%E4%BB%A5%E4%B8%8A%29%E3%82%92%E5%AF%BE%E8%B1%A1%E3%81%AB%E3%80%81%E5%80%8B%E3%80%85%E3%81%AE%E3%83%AA%E3%82%B9%E3%82%AF%E5%9B%A0%E5%AD%90%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%A6%E5%86%85%E5%AE%B9%E3%82%92%E5%A4%89%E3%81%88%E3%82%8B%E3%80%8C%E5%A4%9A%E5%9B%A0%E5%AD%90%E4%BB%8B%E5%85%A5 を比較した経済分析。\n\n・対象20,023人(南ア6,986人、レソト13,037人)、結核はCAD単独で72人、CAD+CRPで60人検出\n・結核1例あたりの検出コスト：CAD単独 5,454ドル、CAD+CRP 7,486ドル(37%高い)\n・CRP検査の追加コストは、確認検査を減らせた分では相殺できなかった\n・有病率が高い集団ほど、1例あたりのコストは大きく下がる\n\n⚠️限界：地域や検診の枠組み(結核単独か、HIV等も含む統合検診か)でコストは変わりうる。見逃しの少なさとのバランス(費用対効果)は別途の評価が必要。\n\n🌍現場の一言：低資源の現場では「精度を一段上げる」追加検査が、必ずしもコストに見合うとは限らない。まず有病率の高い集団に絞る方が効率的かもしれない。\n\n📄 PLOS Glob Public Health 2026 DOI:10.1371/journal.pgph.0007341\n#国際保健 #グローバルヘルス", "x_href": "https://x.com/intent/post?text=%E3%80%90%E7%B5%90%E6%A0%B8%E3%81%AE%E5%9C%B0%E5%9F%9F%E6%A4%9C%E8%A8%BA%E3%80%81AI%E8%AA%AD%E5%BD%B1%E3%81%A0%E3%81%91%E3%81%AE%E6%96%B9%E3%81%8C%E8%BF%BD%E5%8A%A0%E6%A4%9C%E6%9F%BB%E3%82%88%E3%82%8A%E5%AE%89%E3%81%8F%E8%A6%8B%E3%81%A4%E3%81%91%E3%82%89%E3%82%8C%E3%82%8B%21%3F%E3%80%91%0A%0A%E5%8D%97%E3%82%A2%E3%83%95%E3%83%AA%E3%82%AB%E3%81%A8%E3%83%AC%E3%82%BD%E3%83%88%E3%81%AE%E5%9C%B0%E5%9F%9F%E5%AF%86%E7%9D%80%E5%9E%8B%E3%83%BB%E7%B5%90%E6%A0%B8%E3%82%A2%E3%82%AF%E3%83%86%E3%82%A3%E3%83%96%E3%82%B1%E3%83%BC%E3%82%B9%E3%83%95%E3%82%A1%E3%82%A4%E3%83%B3%E3%83%87%E3%82%A3%E3%83%B3%E3%82%B0%28TB%20TRIAGE%2B%E8%A9%A6%E9%A8%93%E3%80%812022%E3%80%9C2024%E5%B9%B4%29%E3%80%82AI%E3%81%AB%E3%82%88%E3%82%8B%E8%83%B8%E9%83%A8X%E7%B7%9A%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%82%BF%E6%94%AF%E6%8F%B4%E6%A4%9C%E5%87%BA%28CAD4TBv7%29%E5%8D%98%E7%8B%AC%E3%81%A8%E3%80%81CRP%E6%A4%9C%E6%9F%BB%E3%82%92%E8%BF%BD%E5%8A%A0%E3%81%97%E3%81%9F%E6%88%A6%E7%95%A5%E3%81%AE%E3%82%B3%E3%82%B9%E3%83%88%E3%82%92%E6%AF%94%E8%BC%83%E3%81%97%E3%81%9F%E7%B5%8C%E6%B8%88%E5%88%86%E6%9E%90%E3%80%82%0A%0A%E3%83%BB%E5%AF%BE%E8%B1%A120%2C023%E4%BA%BA%28%E5%8D%97%E3%82%A26%2C986%E4%BA%BA%E3%80%81%E3%83%AC%E3%82%BD%E3%83%8813%2C037%E4%BA%BA%29%E3%80%81%E7%B5%90%E6%A0%B8%E3%81%AFCAD%E5%8D%98%E7%8B%AC%E3%81%A772%E4%BA%BA%E3%80%81CAD%2BCRP%E3%81%A760%E4%BA%BA%E6%A4%9C%E5%87%BA%0A%E3%83%BB%E7%B5%90%E6%A0%B81%E4%BE%8B%E3%81%82%E3%81%9F%E3%82%8A%E3%81%AE%E6%A4%9C%E5%87%BA%E3%82%B3%E3%82%B9%E3%83%88%EF%BC%9ACAD%E5%8D%98%E7%8B%AC%205%2C4 A10.1371%2Fjournal.pgph.0007341%0A%23%E5%9B%BD%E9%9A%9B%E4%BF%9D%E5%81%A5%20%23%E3%82%B0%E3%83%AD%E3%83%BC%E3%83%90%E3%83%AB%E3%83%98%E3%83%AB%E3%82%B9", "paper_url": "https://doi.org/10.1371/journal.pgph.0007341", "figure": null, "why": "低資源の現場での「精度アップの追加検査は割高になりうる」という費用対効果の具体的な数字"}, {"id": "2026-09-22-7", "n": 7, "category": "parenting", "badges": [], "body": "【「片親家庭は貧困になりやすい」、実はこの10年で当てはまらなくなってきている!?】\n\n米国のパネル調査(PSID)を使い、2013年と2023年の家族構成(結婚しているか、片親か)と子どもの若年成人期の成果との関係を再検証した経済学の研究。平均的な効果ではなく、母親の資源やパートナーからの追加資源によって関連の強さがどう変わるかをみている。\n\n・家族構成と若年成人期の「貧困」との関連は、この10年でかなり弱まっている\n・一方で「大学卒業」との関連は根強く残っており、特に高学歴の母親を持つ子どもに集中している\n・経済状況自体は全体として改善している\n\n⚠️限界：米国のデータで、制度も文化も異なる日本にそのまま当てはめられない。相関関係の分析で、家族構成の違いが結果を生む「原因」かどうかは別に検討が必要。\n\n👶子育ての一言：「片親か両親か」より「教育への投資をどれだけ続けられるか」が効いてきているのかもしれない。進学の後押しは、家庭の形によらず大事にしたい視点。\n\n📄 NBER 2026\nhttps://www.nber.org/papers/w35765\n#子育て #教育経済学", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%80%8C%E7%89%87%E8%A6%AA%E5%AE%B6%E5%BA%AD%E3%81%AF%E8%B2%A7%E5%9B%B0%E3%81%AB%E3%81%AA%E3%82%8A%E3%82%84%E3%81%99%E3%81%84%E3%80%8D%E3%80%81%E5%AE%9F%E3%81%AF%E3%81%93%E3%81%AE10%E5%B9%B4%E3%81%A7%E5%BD%93%E3%81%A6%E3%81%AF%E3%81%BE%E3%82%89%E3%81%AA%E3%81%8F%E3%81%AA%E3%81%A3%E3%81%A6%E3%81%8D%E3%81%A6%E3%81%84%E3%82%8B%21%3F%E3%80%91%0A%0A%E7%B1%B3%E5%9B%BD%E3%81%AE%E3%83%91%E3%83%8D%E3%83%AB%E8%AA%BF%E6%9F%BB%28PSID%29%E3%82%92%E4%BD%BF%E3%81%84%E3%80%812013%E5%B9%B4%E3%81%A82023%E5%B9%B4%E3%81%AE%E5%AE%B6%E6%97%8F%E6%A7%8B%E6%88%90%28%E7%B5%90%E5%A9%9A%E3%81%97%E3%81%A6%E3%81%84%E3%82%8B%E3%81%8B%E3%80%81%E7%89%87%E8%A6%AA%E3%81%8B%29%E3%81%A8%E5%AD%90%E3%81%A9%E3%82%82%E3%81%AE%E8%8B%A5%E5%B9%B4%E6%88%90%E4%BA%BA%E6%9C%9F%E3%81%AE%E6%88%90%E6%9E%9C%E3%81%A8%E3%81%AE%E9%96%A2%E4%BF%82%E3%82%92%E5%86%8D%E6%A4%9C%E8%A8%BC%E3%81%97%E3%81%9F%E7%B5%8C%E6%B8%88%E5%AD%A6%E3%81%AE%E7%A0%94%E7%A9%B6%E3%80%82%E5%B9%B3%E5%9D%87%E7%9A%84%E3%81%AA%E5%8A%B9%E6%9E%9C%E3%81%A7%E3%81%AF%E3%81%AA%E3%81%8F%E3%80%81%E6%AF%8D%E8%A6%AA%E3%81%AE%E8%B3%87%E6%BA%90%E3%82% 研究"}, {"id": "2026-09-21-2", "n": 2, "category": "review", "badges": [], "body": "【緩和ケアのうつに、メチルフェニデートは「効くかもしれない」止まり!?】\n\n緩和ケアを受ける成人（進行した生命を脅かす病気）のうつ症状にメチルフェニデートが効くかを調べたSR・メタ解析（RCT5件、342人）。\n\n・うつ症状の改善：SMD −0.47（95%CI −0.81〜−0.13、P=0.006、I²=58.9%）\n・内訳：うつ目的の3試験 SMD −0.62（−1.18〜−0.05）、倦怠感目的の2試験 SMD −0.30（−0.53〜−0.07）。両者に差なし（P=0.307）\n・治療反応が得られた割合：RR 1.78（95%CI 1.09〜2.89、P=0.021）\n・著者の結論：確実性は「very low〜low」。速効性の抗うつ薬というより、選んだ患者への慎重な個別使用を支持する\n\n⚠️限界：5試験342人と小規模で、異質性も中等度（I²=58.9%）。バイアスリスクは低リスク1件・懸念あり3件・高リスク1件。なお日本では流通管理下の薬で、緩和ケアのうつへの使用は適応外。\n\n🏠在宅医の一言：「抗うつ薬の効果を待つ時間がない」場面の選択肢として海外では議論がある。日本ではすぐ使えないが、議論の枠組みは知っておきたい。\n\n📄 J Pain Symptom Manage 2026 DOI:10.1016/j.jpainsymman.2026.09.015\n#緩和ケア #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E7%B7%A9%E5%92%8C%E3%82%B1%E3%82%A2%E3%81%AE%E3%81%86%E3%81%A4%E3%81%AB%E3%80%81%E3%83%A1%E3%83%81%E3%83%AB%E3%83%95%E3%82%A7%E3%83%8B%E3%83%87%E3%83%BC%E3%83%88%E3%81%AF%E3%80%8C%E5%8A%B9%E3%81%8F%E3%81%8B%E3%82%82%E3%81%97%E3%82%8C%E3%81%AA%E3%81%84%E3%80%8D%E6%AD%A2%E3%81%BE%E3%82%8A%21%3F%E3%80%91%0A%0A%E7%B7%A9%E5%92%8C%E3%82%B1%E3%82%A2%E3%82%92%E5%8F%97%E3%81%91%E3%82%8B%E6%88%90%E4%BA%BA%EF%BC%88%E9%80%B2%E8%A1%8C%E3%81%97%E3%81%9F%E7%94%9F%E5%91%BD%E3%82%92%E8%84%85%E3%81%8B%E3%81%99%E7%97%85%E6%B0%97%EF%BC%89%E3%81%AE%E3%81%86%E3%81%A4%E7%97%87%E7%8A%B6%E3%81%AB%E3%83%A1%E3%83%81%E3%83%AB%E3%83%95%E3%82%A7%E3%83%8B%E3%83%87%E3%83%BC%E3%83%88%E3%81%8C%E5%8A%B9%E3%81%8F%E3%81%8B%E3%82%92%E8%AA%BF%E3%81%B9%E3%81%9FSR%E3%83%BB%E3%83%A1%E3%82%BF%E8%A7%A3%E6%9E%90%EF%BC%88RCT5%E4%BB%B6%E3%80%81342%E4%BA%BA%EF%BC%89%E3%80%82%0A%0A%E3%83%BB%E3%81%86%E3%81%A4%E7%97%87%E7%8A%B6%E3%81%AE%E6%94%B9%E5%96%84%EF%BC%9ASMD%20%E2%88%920.47%EF%BC%8895%25CI%20%E2%88%920.81%E3%80%9C%E2%88%920.13%E3%80%81P%3D0.006%E3%80%81I%C2%B2%3D58.9%25%EF%BC%89%0A%E3%83%BB%E5%86%85%E8%A8%B3%EF%BC%9A%E3%81%86%E3%81%A4%E7%9B%AE%E7%9A%84%E3%81%AE3%E8%A9%A6%E9%A8%93%20SMD%20%E2%88%920.62%EF%BC%88%E2%88%921.18%E3%80%9C%E2%88%920.05%EF%BC%89%E3%80%81%E5%80% E3%81%8C%E3%81%82%E3%82%8B%E3%80%82%E6%97%A5%E6%9C%AC%E3%81%A7%E3%81%AF%E3%81%99%E3%81%90%E4%BD%BF%E3%81%88%E3%81%AA%E3%81%84%E3%81%8C%E3%80%81%E8%AD%B0%E8%AB%96%E3%81%AE%E6%9E%A0%E7%B5%84%E3%81%BF%E3%81%AF%E7%9F%A5%E3%81%A3%E3%81%A6%E3%81%8A%E3%81%8D%E3%81%9F%E3%81%84%E3%80%82%0A%0A%F0%9F%93%84%20J%20Pain%20Symptom%20Manage%202026%20DOI%3A10.1016%2Fj.jpainsymman.2026.09.015%0A%23%E7%B7%A9%E5%92%8C%E3%82%B1%E3%82%A2%20%23%E5%9C%A8%E5%AE%85%E5%8C%BB%E7%99%82", "paper_url": "https://doi.org/10.1016/j.jpainsymman.2026.09.015", "figure": null, "why": "緩和ケアのうつという日常的な悩みに、RCTを束ねた最新の答え（ただし確実性は低い）が出た"}, {"id": "2026-09-21-3", "n": 3, "category": "medical", "badges": [], "body": "【「ぱっと見」のフレイル判定、\"否定する\"力は驚くほど高かった!?】\n\n70歳以上で冠動脈造影に紹介された200人（平均77.3±5.3歳）を対象に、循環器医2人が盲検で(1)正式なFried基準と(2)「ぱっと見（eyeballing）」でフレイルを評価し、精度を比べた前向き観察研究。\n\n・Fried基準でのフレイル有病率：16.5%\n・ぱっと見の感度93.9%、陰性的中率98.5%、AUC 0.87\n・一方で特異度80.8%、陽性的中率49.2%（フレイルと見立てた人の約半数は外れ）\n・特異度は女性と入院中の患者で低かった\n・Fried基準のフレイルは6か月死亡・心血管再入院の増加と関連\n\n⚠️限界：冠動脈造影に紹介された200人という限られた集団で、在宅や一般外来の高齢者にそのまま当てはまるとは限らない。評価者は循環器医2人のみで、経験差による再現性は不明。\n\n🏠在宅医の一言：「元気そう」と感じたときはフレイルをほぼ否定してよい一方、「フレイルっぽい」は当たり外れが大きい。疑ったときこそ握力や歩行速度を測りたい。\n\n📄 J Am Geriatr Soc 2026 DOI:10.1111/jgs.70713\n#総合内科 #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%80%8C%E3%81%B1%E3%81%A3%E3%81%A8%E8%A6%8B%E3%80%8D%E3%81%AE%E3%83%95%E3%83%AC%E3%82%A4%E3%83%AB%E5%88%A4%E5%AE%9A%E3%80%81%22%E5%90%A6%E5%AE%9A%E3%81%99%E3%82%8B%22%E5%8A%9B%E3%81%AF%E9%A9%9A%E3%81%8F%E3%81%BB%E3%81%A9%E9%AB%98%E3%81%8B%E3%81%A3%E3%81%9F%21%3F%E3%80%91%0A%0A70%E6%AD%B3%E4%BB%A5%E4%B8%8A%E3%81%A7%E5%86%A0%E5%8B%95%E8%84%88%E9%80%A0%E5%BD%B1%E3%81%AB%E7%B4%B9%E4%BB%8B%E3%81%95%E3%82%8C%E3%81%9F200%E4%BA%BA%EF%BC%88%E5%B9%B3%E5%9D%8777.3%C2%B15.3%E6%AD%B3%EF%BC%89%E3%82%92%E5%AF%BE%E8%B1%A1%E3%81%AB%E3%80%81%E5%BE%AA%E7%92%B0%E5%99%A8%E5%8C%BB2%E4%BA%BA%E3%81%8C%E7%9B%B2%E6%A4%9C%E3%81%A7%281%29%E6%AD%A3%E5%BC%8F%E3%81%AAFried%E5%9F%BA%E6%BA%96%E3%81%A8%282%29%E3%80%8C%E3%81%B1%E3%81%A3%E3%81%A8%E8 i.nlm.nih.gov/42754543/"}, {"title": "The Association Between Visual Impairment and Delirium: A Systematic Review and Meta-Analysis.（J Gen Intern Med）", "url": "https://pubmed.ncbi.nlm.nih.gov/42760461/"}, {"title": "Controlled Drug Use and Falls in Older People With Neurogenic Claudication: Secondary Analysis of the BOOST RCT.（J Am Geriatr Soc）", "url": "https://pubmed.ncbi.nlm.nih.gov/42755166/"}, {"title": "The Mean and Variability of Morning Hour Activity Over 2-3 Days Predict 5-Year Mortality and Frailty Risk.（J Am Geriatr Soc）", "url": "https://pubmed.ncbi.nlm.nih.gov/42754817/"}, {"title": "Exercise-based cardiac rehabilitation for coronary heart disease.（Cochrane Database Syst Rev）", "url": "https://pubmed.ncbi.nlm.nih.gov/42754260/"}, {"title": "Extreme Temperatures, Elevated PM2.5, and Acute Care Events Among Dual-Eligible Nursing Facility Residents.（J Am Geriatr Soc）", "url": "https://pubmed.ncbi.nlm.nih.gov/42760629/"}, {"title": "Physicians' Beliefs About Treating Asymptomatic Elevated Blood Pressure Readings Among Hospitalized Patients.（J Gen Intern Med）", "url": "https://pubmed.ncbi.nlm.nih.gov/42760462/"}, {"title": "Implementation factors of group antenatal care in low-resource settings in Tanzania.（PLOS Glob Public Health）", "url": "https://pubmed.ncbi.nlm.nih.gov/42758772/"}, {"title": "Qualitative exploration of women's perceptions of cervical cancer screening in Uganda.（PLOS Glob Public Health）", "url": "https://pubmed.ncbi.nlm.nih.gov/42758761/"}, {"title": "Scaling-up tuberculosis preventive therapy to HIV-negative contacts in Zambia.（PLOS Glob Public Health）", "url": "https://pubmed.ncbi.nlm.nih.gov/42758766/"}]}, "2026-09-20": {"label": "2026-09-20（日）・3本", "posts": [{"id": "2026-09-20-1", "n": 1, "category": "medical", "badges": ["🔍深掘り候補"], "body": "【フレイルな高齢者ほど、高用量インフルワクチンが効く!?】\n\nデンマークの無作為化試験DANFLU-2（65歳以上、約33万人）の事前規定解析。高用量 vs 標準量インフルエンザワクチンで「インフルエンザ・肺炎による入院」を比べ、フレイルリスク（HFRS）別に効果を見た。\n\n・入院率：低フレイル0.5%、中1.5%、高4.2%\n・相対的有効性：低0.2%、中13.1%、高19.9%\n・HFRSを連続量で見ると、フレイルが強いほど効果が高い（交互作用p=0.020）\n・重篤な有害事象の割合は、どのフレイル群でも高用量と標準量で同程度\n\n⚠️限界：事前に決めた3群での比較では交互作用なし（p=0.17）。群ごとの95%CIはすべて0をまたぐ。オープンラベルで、資金はSanofi。著者自身も探索的な結果としている。\n\n🏠在宅医の一言：訪問診療の患者さんの多くは「高フレイル群」。高用量ワクチンを選択肢として話題にする根拠が一つ増えた、くらいの温度感で受け止めたい。\n\n📄 Lancet Healthy Longev 2026 DOI:10.1016/j.lanhl.2026.100894\n#総合内科 #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%83%95%E3%83%AC%E3%82%A4%E3%83%AB%E3%81%AA%E9%AB%98%E9%BD%A2%E8%80%85%E3%81%BB%E3%81%A9%E3%80%81%E9%AB%98%E7%94%A8%E9%87%8F%E3%82%A4%E3%83%B3%E3%83%95%E3%83%AB%E3%83%AF%E3%82%AF%E3%83%81%E3%83%B3%E3%81%8C%E5%8A%B9%E3%81%8F%21%3F%E3%80%91%0A%0A%E3%83%87%E3%83%B3%E3%83%9E%E3%83%BC%E3%82%AF%E3%81%AE%E7%84%A1%E4%BD%9C%E7%82%BA%E5%8C%96%E8%A9%A6%E9%A8%93DANFLU-2%EF%BC%8865%E6%AD%B3%E4%BB%A5%E4%B8%8A%E3%80%81%E7%B4%8433%E4%B8%87%E4%BA%BA%EF%BC%89%E3%81%AE%E4%BA%8B%E5%89%8D%E8%A6%8F%E5%AE%9A%E8%A7%A3%E6%9E%90%E3%80%82%E9%AB%98%E7%94%A8%E9%87%8F%20vs%20%E6%A8%99%E6%BA%96%E9%87%8F%E3%82%A4%E3%83%B3%E3%83%95%E3%83%AB%E3%82%A8%E3%83%B3%E3%82%B6%E3%83%AF%E3%82%AF%E3%83%81%E3%83%B3%E3%81%A7%E3%80%8C%E3%82%A4%E3%83%B3%E3%83%95%E3%83%AB%E3%82%A8%E3%83%B3%E3%82%B6%E3%83%BB%E8%82%BA%E7%82%8E%E3%81%AB%E3%82%88%E3%82%8B%E5%85%A5%E9%99%A2%E3%80%8D%E3%82%92%E6%AF%94%E3%81%B9%E3%80%81%E3%83%95%E3%83%AC%E3%82%A4%E3%83%AB%E3%83%AA%E3%82%B9%E3%82%AF%EF%BC%88HFRS%EF%BC%89%E5%88%A5%E3%81%AB%E5%8A%B9%E6%9E%9C%E3%82%92%E8%A6%8B%E3%81%9F%E3%80%82%0A%0A%E3%83%BB%E5%85%A5%E9%99%A2%E7%8E%87%EF%BC%9A%E4%BD%8E%E3%83%95%E3%83%AC%E3%82%A4%E3%83%AB0.5%25%E3%80%81%E4%B8%AD1.5%25%E3%80%81%E9%AB%984.2%25%0A%E3%83%BB%E7%9B%B8%E5%AF%BE%E7%9A%84%E6%9C%89%E5%8A%B9%E6%80%A7%EF%BC%9A%E4%BD%8E0.2%25%E3%80%81%E4%B8%AD13.1%25%E3%80%81%E9%AB%9819.9%25%0A%E3%83%BBHFRS%E3%82%92%E9%80%A3%E7%B6%9A%E9%87%8F%E3%81%A7%E8%A6%8B%E3%82%8B%E3%81%A8%E3%80%81%E3%83%95%E3%83%AC%E3%82%A4%E3%83%AB%E3%81%8C%E5%BC%B7%E3%81%84%E3%81%BB%E3%81%A9%E5%8A%B9%E6%9E%9C%E3%81%8C%E9%AB%98%E3%81%84%EF%BC%88%E4%BA%A4%E4%BA%92%E4%BD%9C%E7%94%A8p%3D0.020%EF%BC%89%0A%E3%8 body": "【がん性腹水のCART、延命効果は「ほぼなし」!?】\n\n日本のレセプト全国データ（NDB）で、亡くなる前1年以内に腹水ドレナージを受けたがん患者を解析。最初にCART（腹水濾過濃縮再静注法）を受けた10,654人と、穿刺排液のみの37,272人を比べた。\n\n・全生存期間の中央値：31日 vs 28日（調整HR 0.97、95%CI 0.95–0.99）→ 臨床的に意味のある延命はなし\n・再ドレナージ：調整HR 0.73（95%CI 0.72–0.74）\n・ドレナージの間隔の中央値：15日 vs 8.3日\n・肝細胞がん・肝転移のある人で、再ドレナージの減少がより大きい傾向\n\n⚠️限界：後ろ向きのレセプト研究で、どちらを選んだかの背景（全身状態など）の偏りは残りうる。データは2013〜2016年。評価項目は生存と再ドレナージで、症状やQOLは含まれない。\n\n🏠在宅医の一言：CARTは「命を延ばす治療」ではなく「抜く回数を減らす治療」と説明するのが誠実。通院や入院の負担と、本人の目標に合わせて選びたい。\n\n📄 J Pain Symptom Manage 2026 DOI:10.1016/j.jpainsymman.2026.09.017\n#緩和ケア #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%81%8C%E3%82%93%E6%80%A7%E8%85%B9%E6%B0%B4%E3%81%AECART%E3%80%81%E5%BB%B6%E5%91%BD%E5%8A%B9%E6%9E%9C%E3%81%AF%E3%80%8C%E3%81%BB%E3%81%BC%E3%81%AA%E3%81%97%E3%80%8D%21%3F%E3%80%91%0A%0A%E6%97%A5%E6%9C%AC%E3%81%AE%E3%83%AC%E3%82%BB%E3%83%97%E3%83%88%E5%85%A8%E5%9B%BD%E3%83%87%E3%83%BC%E3%82%BF%EF%BC%88NDB%EF%BC%89%E3%81%A7%E3%80%81%E4%BA%A1%E3%81%8F%E3%81%AA%E3%82%8B%E5%89%8D1%E5%B9%B4%E4%BB%A5%E5%86%85%E3%81%AB%E8%85%B9%E6%B0%B4%E3%83%89%E3%83%AC%E3%83%8A%E3%83%BC%E3%82%B8%E3%82%92%E5%8F%97%E3%81%91%E3%81%9F%E3%81%8C%E3%82%93%E6%82%A3%E8%80%85%E3%82%92%E8%A7%A3%E6%9E%90%E3%80%82%E6%9C%80%E5%88%9D%E3%81%ABCART%EF%BC%88%E8%85%B9%E6%B0%B4%E6%BF%BE%E9%81%8E%E6%BF%83%E7%B8%AE%E5%86%8D%E9%9D%99%E6%B3%A8%E6%B3%95%EF%BC%89%E3%82%92%E5%8F%97%E3%81%91%E3%81%9F10%2C654%E4%BA%BA%E3%81%A8%E3%80%81%E7%A9%BF%E5%88%BA%E6%8E%92%E6%B6%B2%E3%81%AE%E3%81%BF%E3%81%AE37%2C272%E4%BA%BA%E3%82%92%E6%AF%94%E3%81%B9%E3%81%9F%E3%80%82%0A%0A%E3%83%BB%E5%85%A8%E7%94%9F%E5%AD%98%E6%9C%9F%E9%96%93%E3%81%AE%E4%B8%AD%E5%A4%AE%E5%80%A4%EF%BC%9A31%E6%97%A5%20vs%2028%E6%97%A5%EF%BC%88%E8%AA%BF%E6%95%B4HR%200.97%E3%80%8195%25CI%200.95%E2%80%930.99%EF%BC%89%E2%86%92%20%E8%87%A8%E5%BA%8A%E7%9A%84%E3%81%AB%E6%84%8F%E5%91%B3%E3%81%AE%E3%81%82%E3%82%8B%E5%BB%B6%E5%91%BD%E3%81%AF%E3%81%AA%E3%81%97%0A%E3%83%BB%E5%86%8D%E3%83%89%E3%83%AC%E3%83%8A%E3%83%BC%E3%82%B8%EF%BC%9A%E8%AA%BF%E6%95%B4HR%200.73%EF%BC%8895 %23%E5%9C%A8%E5%AE%85%E5%8C%BB%E7%99%82", "paper_url": "https://doi.org/10.1016/j.jpainsymman.2026.09.017", "figure": null, "why": "日本の全国データで、在宅・緩和でよく相談されるCARTの効果を「延命」と「排液回数」に分けて示した"}, {"id": "2026-09-20-3", "n": 3, "category": "medical", "badges": [], "body": "【認知症があっても、STEMIのカテ治療後に「自宅で過ごせる時間」は十分ある!?】\n\n米国メディケアの全数データ（2017〜2022年）で、STEMIで救急受診し心臓カテーテルを受けた65歳以上の117,318人を解析。主要評価項目は「その後1年間に自宅で過ごせた日数（days alive at home）」。\n\n・地域在住で認知症あり vs なし：調整差 −37.8日（95%CI −41.1〜−34.5）。それでも認知症ありの半数以上が300日を超えて自宅で過ごした\n・施設から搬送された人では、認知症ありで差がさらに大きく（調整差 −71.9日）、1年生存率は42.4%と報告\n・著者の結論：認知症であることだけを理由に、適切なSTEMI治療をためらうべきではない\n\n⚠️限界：カテーテルを受けた人だけを見た後ろ向き研究で、治療を見送った人とは比べていない。請求データなので、認知症の程度や本人の意向までは分からない。\n\n🏠在宅医の一言：「認知症だから搬送やカテは…」と一律に決めず、住まい（自宅か施設か）と本人の目標で話し合うための材料に。ACPの場で使える数字。\n\n📄 J Am Geriatr Soc 2026 DOI:10.1111/jgs.70705\n#総合内科 #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E8%AA%8D%E7%9F%A5%E7%97%87%E3%81%8C%E3%81%82%E3%81%A3%E3%81%A6%E3%82%82%E3%80%81STEMI%E3%81%AE%E3%82%AB%E3%83%86%E6%B2%BB%E7%99%82%E5%BE%8C%E3%81%AB%E3%80%8C%E8%87%AA%E5%AE%85%E3%81%A7%E9%81%8E%E3%81%94%E3%81%9B%E3%82%8B%E6%99%82%E9%96%93%E3%80%8D%E3%81%AF%E5%8D%81%E5%88%86%E3%81%82%E3%82%8B%21%3F%E3%80%91%0A%0A%E7%B1%B3%E5%9B%BD%E3%83%A1%E3%83%87%E3%82%A3%E3%82%B1%E3%82%A2%E3%81%AE%E5%85%A8%E6%95%B0%E3%83%87%E3%83%BC%E3%82%BF%EF%BC%882017%E3%80%9C2022%E5%B9%B4%EF%BC%89%E3%81%A7%E3%80%81STEMI%E3%81%A7%E6%95%91%E6%80%A5%E5%8F%97%E8%A8%BA%E3%81%97%E5%BF%83%E8%87%93%E3%82%AB%E3%83%86%E3%83%BC%E3%83%86%E3%83%AB%E3%82%92%E5%8F%97%E3%81%91%E3%81%9F65%E6%AD%B3%E4%BB%A5%E4%B8%8A%E3%81%AE117%2C318%E4%BA%BA%E3%82%92%E8%A7%A3%E6%9E%90%E3%80%82%E4%B8%BB%E8%A6%81%E8%A9%95%E4%BE%A1%E9%A0%85%E7%9B%AE%E3%81%AF%E3%80%8C%E3%81%9D%E3%81%AE%E5%BE%8C1%E5%B9%B4%E9%96%93%E3%81%AB%E8%87%AA%E5%AE%85%E3%81%A7%E9%81%8E%E3%81%94%E3%81%9B%E3%81%9F%E6%97%A5%E6%95%B0%EF%BC%88days%20alive%20at%20home%EF%BC%89%E3%80%8D%E3%80%82%0A%0A%E3%83%BB%E5%9C%B0%E5%9F%9F%E5%9C%A8%E4%BD%8F%E3%81%A7%E8%AA%8D%E7%9F%A5%E7%97%87%E3%81%82%E3%82%8A%20vs%20%     var rest = lines.slice(1).join("\n").replace(/^\n+/, "");
    var html = '<article class="post cat-' + esc(p.category) + '">';
    if (badges) html += '<div class="badges">' + badges + "</div>";
    if (hook) html += '<p class="hook">' + esc(hook) + "</p>";
    if (rest) html += '<p class="body-text">' + esc(rest) + "</p>";
    html += '<div class="actions">';
    html += '<button type="button" class="primary x-open" data-id="' + esc(p.id) + '">Xで開く</button>';
    if (p.paper_url) {
      html += '<a href="' + esc(p.paper_url) + '" target="_blank" rel="noopener">' + paperLabel(p.paper_url) + "</a>";
    }
    html += "</div>";
    if (p.figure) html += '<p class="meta-line">🖼 ' + esc(p.figure) + "</p>";
    if (p.why) html += '<p class="meta-line">💡 ' + esc(p.why) + "</p>";
    html += "</article>";
    return html;
  }

  function renderRunnersUp(items) {
    if (!items || !items.length) return "";
    var lis = items.map(function (r) {
      return "<li>" + esc(r.title) + ' <a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.url) + "</a></li>";
    }).join("");
    return '<details class="runners-up"><summary>次点（' + items.length + '）</summary><ul>' + lis + "</ul></details>";
  }

  function buildDay(date) {
    var day = DATA.days[date];
    var section = document.createElement("section");
    section.className = "day";
    section.dataset.date = date;
    section.hidden = true;
    var postsHtml = (day.posts.length
      ? day.posts.map(renderPost).join("")
      : "<p>きょうは該当なしでした。</p>");
    section.innerHTML = postsHtml + renderRunnersUp(day.runners_up);
    daysEl.appendChild(section);
    sections[date] = section;
  }

  DATES.forEach(buildDay);

  function currentIndex() {
    return DATES.indexOf(selectEl.value);
  }

  function showDay(date) {
    if (!sections[date]) return;
    DATES.forEach(function (d) { sections[d].hidden = (d !== date); });
    selectEl.value = date;
    prevBtn.disabled = currentIndex() >= DATES.length - 1;
    nextBtn.disabled = currentIndex() <= 0;
    try { window.localStorage.setItem("iryohee-last-date", date); } catch (e) { /* 無視する */ }
  }

  function initialDate() {
    var stored = null;
    try { stored = window.localStorage.getItem("iryohee-last-date"); } catch (e) { /* 無視する */ }
    if (stored && sections[stored]) return stored;
    return DATES[0];
  }

  selectEl.addEventListener("change", function () { showDay(selectEl.value); });
  prevBtn.addEventListener("click", function () {
    var i = currentIndex();
    if (i < DATES.length - 1) showDay(DATES[i + 1]);
  });
  nextBtn.addEventListener("click", function () {
    var i = currentIndex();
    if (i > 0) showDay(DATES[i - 1]);
  });
  daysEl.addEventListener("click", function (ev) {
    var btn = ev.target.closest(".x-open");
    if (!btn) return;
    var p = postsById[btn.dataset.id];
    if (!p) return;
    var url = p.body ? (XBASE + encodeURIComponent(p.body)) : p.x_href;
    if (url) window.open(url, "_blank", "noopener");
  });

  if (DATES.length) showDay(initialDate());
})();
</script>
</body>
</html>

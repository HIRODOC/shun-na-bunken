<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>旬な文献</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f4;
  --card-bg: #ffffff;
  --fg: #1c1917;
  --muted: #6b7280;
  --border: #e7e5e4;
  --accent: #475569;
  --business: #b45309;
  --global: #15803d;
  --happiness: #e11d48;
  --parenting: #2563eb;
  --review: #7c3aed;
  --link: #2563eb;
  --primary-btn-bg: #1c1917;
  --primary-btn-fg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131110;
    --card-bg: #201d1b;
    --fg: #f3f2f0;
    --muted: #9c9691;
    --border: #35302c;
    --accent: #94a3b8;
    --business: #f0b862;
    --global: #4ade80;
    --happiness: #fb7185;
    --parenting: #93c5fd;
    --review: #c4b5fd;
    --link: #93c5fd;
    --primary-btn-bg: #f3f2f0;
    --primary-btn-fg: #1c1917;
  }
}
:root[data-theme="dark"] {
  --bg: #131110;
  --card-bg: #201d1b;
  --fg: #f3f2f0;
  --muted: #9c9691;
  --border: #35302c;
  --accent: #94a3b8;
  --business: #f0b862;
  --global: #4ade80;
  --happiness: #fb7185;
  --parenting: #93c5fd;
  --review: #c4b5fd;
  --link: #93c5fd;
  --primary-btn-bg: #f3f2f0;
  --primary-btn-fg: #1c1917;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  line-height: 1.7;
  overflow-x: hidden;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
}
h1 {
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  font-size: 1.05rem;
  margin: 0 0 8px;
}
.nav-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-row select {
  flex: 1;
  min-width: 0;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--fg);
  font-size: 0.95rem;
}
.nav-row button {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--fg);
  font-size: 0.95rem;
  white-space: nowrap;
}
.nav-row button:disabled { opacity: 0.4; }
main {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px;
}
.post {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-left: 5px solid var(--accent);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.post.cat-business { border-left-color: var(--business); }
.post.cat-global { border-left-color: var(--global); }
.post.cat-happiness { border-left-color: var(--happiness); }
.post.cat-parenting { border-left-color: var(--parenting); }
.post.cat-review { border-left-color: var(--review); }
.badges { margin-bottom: 6px; }
.badge {
  display: inline-block;
  font-size: 0.72rem;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 1px 8px;
  margin-right: 4px;
}
.hook {
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  font-weight: 700;
  font-size: 1.05rem;
  margin: 0 0 8px;
}
.body-text {
  white-space: pre-wrap;
  word-break: break-word;
  margin: 0 0 10px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}
.actions button, .actions a {
  display: inline-block;
  text-decoration: none;
  font-size: 0.85rem;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--fg);
  background: var(--bg);
}
.actions .primary {
  background: var(--primary-btn-bg);
  color: var(--primary-btn-fg);
  border-color: var(--primary-btn-bg);
}
.meta-line {
  font-size: 0.8rem;
  color: var(--muted);
  margin: 2px 0;
}
.hbr-buzz {
  background: var(--card-bg);
  border: 1px dashed var(--accent);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.hbr-buzz-why {
  color: var(--muted);
  font-size: 0.85rem;
}
.big5-reviews {
  background: var(--card-bg);
  border: 1px solid var(--review);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.big5-reviews-title {
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--review);
  margin: 0 0 2px;
}
.big5-reviews-note {
  font-size: 0.75rem;
  color: var(--muted);
  margin: 0 0 10px;
}
.big5-review-item {
  padding: 8px 0;
  border-top: 1px solid var(--border);
}
.big5-review-item:first-of-type {
  padding-top: 0;
  border-top: none;
}
.big5-review-item .hook { font-size: 0.95rem; margin: 0 0 4px; }
.big5-review-item .meta-line { margin: 0 0 4px; }
.big5-review-item .conclusion {
  font-size: 0.85rem;
  color: var(--muted);
  white-space: pre-wrap;
  word-break: break-word;
  margin: 0 0 6px;
}
.big5-review-item a {
  font-size: 0.85rem;
  color: var(--link);
  text-decoration: none;
}
details.runners-up {
  margin: 8px 0 24px;
  font-size: 0.85rem;
  color: var(--muted);
}
details.runners-up ul { padding-left: 1.2em; }
details.runners-up a { color: var(--link); }
footer {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px;
  color: var(--muted);
  font-size: 0.8rem;
}
noscript { display: block; padding: 16px; }
@media (max-width: 400px) {
  main, footer { padding: 16px; }
}
</style>
</head>

襲手術は95.8%と7.3%\n\n⚠️限界：観察研究で、院内で待てたのは軽症の人だったなど、重症度による偏りの可能性がある。解析は欠測のない症例のみ。\n\n🌍現場の一言：穿孔を減らす鍵は、院内の手術を急ぐことより「発症から24時間以内に外科評価へつなぐ」こと。地域の診療所や搬送の仕組みが結果を左右しそう。CTの格差も大きい。\n\n📄 Lancet Glob Health 2026 DOI:10.1016/j.langlo.2026.104015\n#国際保健 #グローバルヘルス", "x_href": "https://x.com/intent/post?text=%E3%80%90%E8%99%AB%E5%9E%82%E7%82%8E%E3%81%AE%E7%A9%BF%E5%AD%94%E3%82%92%E6%B1%BA%E3%82%81%E3%82%8B%E3%81%AE%E3%81%AF%E3%80%81%E7%97%85%E9%99%A2%E3%81%AB%E7%9D%80%E3%81%8F%E3%80%8C%E5%89%8D%E3%80%8D%E3%81%AE%E6%99%82%E9%96%93%21%3F%E3%80%91%0A%0A112%E3%81%8B%E5%9B%BD1%2C377%E7%97%85%E9%99%A2%E3%81%A7%E3%80%81%E8%99%AB%E5%9E%82%E7%82%8E%E7%96%91%E3%81%84%E3%81%A7%E7%B7%8A%E6%80%A5%E6%89%8B%E8%A1%93%E3%82%92%E5%8F%97%E3%81%91%E3%81%9F45%2C218%E4%BA%BA%E3%82%92%E8%BF%BD%E3%81%A3%E3%81%9F%E5%9B%BD%E9%9A%9B%E5%89%8D%E5%90%91%E3%81%8D%E3%82%B3%E3%83%9B%E3%83%BC%E3%83%88%EF%BC%88AlliGatOr%E3%80%812025%E5%B9%B42%E3%80%9C5%E6%9C%88%EF%BC%89%E3%80%82%0A%0A%E3%83%BB%E7%A9%BF%E5%AD%94%E3%81%AF32.0%25%0A%E3%83%BB%E7%97%87%E7%8A%B6%E3%81%8B%E3%82%89%E5%88%9D%E5%9B%9E%E3%81%AE%E5%A4%96%E7%A7%91%E8%A9%95%E4%BE%A1%E3%81%BE%E3%81%A7%E3%81%AE%E6%99%82%E9%96%93%E3%81%8C%E9%95%B7%E3%81%84%E3%81%BB%E3%81%A9%E7%A9%BF%E5%AD%94%E3%81%8C%E5%A2%97%E5%8A%A0%EF%BC%9A12%E6%99%82%E9%96%93%E6%9C%AA%E6%BA%8022.9%25%E2%86%9272%E6%99%82%E9%96%93%E4%BB%A5%E4%B8%8A48.0%25%EF%BC%88%E8%AA%BF%E6%95%B4RR%201.85%E3%80%8195%25CI%201.75%E3%80%9C1.95%EF%BC%89%0A%E3%83%BB%E4%B8%80%E6%96%B9%E3%80%81%E5%A4%96%E7%A7%91%E8%A9%95%E4%BE%A1%E3%81%8B%E3%82%89%E5%9F%B7%E5%88%80%E3%81%BE%E3%81%A7%E3%81%AE%E9%99%A2%E5%86%85%E6%99%82%E9%96%93%E3%81%8C48%E6%99%82%E9%96%93%E4%BB%A5%E4%B8%8A%E3%81%A7%E3%82%82%E3%80%81%E7%A9%BF%E5%AD%94%E3%81%AF%E3%82%80%E3%81%97%E3%82%8D%E5%B0%91%E3%81%AA%E3%81%8B%E3%81%A3%E3%81%9F%EF%BC%88%E8%AA%BF%E6%95%B4RR%200.82%EF%BC%89%0A%E3%83%BB%E8%A1%93%E5%89%8DCT%E3%81%82%E3%82%8A%E3%81%A7%E9%99%B0%E6%80%A7%E8%99%AB%E5%9E%82%E5%88%87%E9%99%A4%E3%81%8C%E5%B0%91%E3%81%AA%E3%81%84%EF%BC%88%E8%AA%BF%E6%95%B4RR%200.69%E の望みに応えるほど、害が生まれることがある!?】\n\n「ユーザー中心」を掲げるデザイン思考が、思わぬ害を生むことがある――MIT Sloan Management Reviewの研究紹介（2026年9月23日公開）。\n\n・米国と欧州の経営層27人にインタビュー\n・「ユーザーが望むものを与える」ことに集中すると、倫理的な配慮が抜け落ちやすい\n・例：エンゲージメントを高める機能が依存的な行動を招いた、パーソナライズが極端で分極的なコンテンツを増幅した\n・対策は3つ：①ミッションと価値観を設計の出発点に置く ②KPIや報酬が設計の選択をどう曲げるかに注意する ③規模を広げる前に、社会への広い影響を立ち止まって考える\n\n⚠️限界：27人へのインタビューに基づく質的研究で、例はIT・消費者向けサービスが中心。医療の現場にそのまま当てはまるかは分からない。\n\n💼経営の一言：クリニックでも「患者満足度」や「待ち時間」だけを指標にすると、希望どおりの処方や検査に流れやすい。新しいサービスを始める前に「うちがやらないこと」を先に決めておくのが良さそう。\n\n📄 MIT Sloan Management Review 2026 DOI:10.63383/exwf2769\n#クリニック経営 #組織づくり", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%83%A6%E3%83%BC%E3%82%B6%E3%83%BC%E3%81%AE%E6%9C%9B%E3%81%BF%E3%81%AB%E5%BF%9C%E3%81%88%E3%82%8B%E3%81%BB%E3%81%A9%E3%80%81%E5%AE%B3%E3%81%8C%E7%94%9F%E3%81%BE%E3%82%8C%E3%82%8B%E3%81%93%E3%81%A8%E3%81%8C%E3%81%82%E3%82%8B%21%3F%E3%80%91%0A%0A%E3%80%8C%E3%83%A6%E3%83%BC%E3%82%B6%E3%83%BC%E4%B8%AD%E5%BF%83%E3%80%8D%E3%82%92%E6%8E%B2%E3%81%92%E3%82%8B%E3%83%87%E3%82%B6%E3%82%A4%E3%83%B3%E6%80%9D%E8%80%83%E3%81%8C%E3%80%81%E6%80%9D%E3%82%8F%E3%81%AC%E5%AE%B3%E3%82%92%E7%94%9F%E3%82%80%E3%81%93%E3%81%A8%E3%81%8C%E3%81%82%E3%82%8B%E2%80%95%E2%80%95MIT%20Sloan%20Management%20Review%E3%81%AE%E7%A0%94%E7%A9%B6%E7%B4%B9%E4%BB%8B%EF%BC%882026%E5%B9%B49%E6%9C%8823%E6%97%A5%E5%85%AC%E9%96%8B%EF%BC%89%E3%80%82%0A%0A%E3%83%BB%E7%B1%B3%E5%9B%BD%E3%81%A8%E6%AC%A7%E5%B7%9E%E3%81%AE%E7%B5%8C%E5%96%B6%E5%B1%A427%E4%BA%BA%E3%81%AB%E3%82%A4%E3%83%B3%E3%82%BF%E3%83%93%E3%83%A5%E3%83%BC%0A%E3%83%BB%E3%80%8C%E3%83%A6%E3%83%BC%E3%82%B6%E3%83%BC%E3%81%8C%E6%9C%9B%E3%82%80%E3%82%82%E3%81%AE%E3%82%92%E4%B8%8E%E3%81%88%E3%82%8B%E3%80%8D%E3%81%93%E3%81%A8%E3%81%AB%E9%9B%86%E4%B8%AD%E3%81%99%E3%82%8B%E3%81%A8%E3%80%81%E5%80%AB%E7%90%86%E7%9A%84%E3%81%AA%E9%85%8D%E6%85%AE%E3%81%8C%E6%8A%9C%E3%81%91%E8%90%BD%E3%81%A1%E3%82%84%E3%81%99%E3%81%84%0A%E3%83%BB%E4%BE%8B%EF%BC%9A%E3%82%A8%E3%83%B3%E3%82%B2%E3%83%BC%E3%82%B8%E3%83%A1%E3%83%B3%E3%83%88%E3%82%92%E9%AB%98%E3%82%81%E3%82%8B%E6%A9%9F%E8%8 3%82%8A%E3%81%AE%E5%87%A6%E6%96%B9%E3%82%84%E6%A4%9C%E6%9F%BB%E3%81%AB%E6%B5%81%E3%82%8C%E3%82%84%E3%81%99%E3%81%84%E3%80%82%E6%96%B0%E3%81%97%E3%81%84%E3%82%B5%E3%83%BC%E3%83%93%E3%82%B9%E3%82%92%E5%A7%8B%E3%82%81%E3%82%8B%E5%89%8D%E3%81%AB%E3%80%8C%E3%81%86%E3%81%A1%E3%81%8C%E3%82%84%E3%82%89%E3%81%AA%E3%81%84%E3%81%93%E3%81%A8%E3%80%8D%E3%82%92%E5%85%88%E3%81%AB%E6%B1%BA%E3%82%81%E3%81%A6%E3%81%8A%E3%81%8F%E3%81%AE%E3%81%8C%E8%89%AF%E3%81%95%E3%81%9D%E3%81%86%E3%80%82%0A%0A%F0%9F%93%84%20MIT%20Sloan%20Management%20Review%202026%20DOI%3A10.63383%2Fexwf2769%0A%23%E3%82%AF%E3%83%AA%E3%83%8B%E3%83%83%E3%82%AF%E7%B5%8C%E5%96%B6%20%23%E7%B5%84%E7%B9%94%E3%81%A5%E3%81%8F%E3%82%8A", "paper_url": "https://doi.org/10.63383/exwf2769", "figure": null, "why": "2日前公開の新しい研究紹介で、深掘りの「理念とやらないこと」と同じ流れで読めるため。"}, {"id": "2026-09-25-6", "n": 6, "category": "business", "badges": ["💼 📅"], "body": "【子育て中の職員、とくに母親は「家族に誇れる仕事」がやる気の源に!?】\n\n2026年2月の研究ですが、「子育て中の人、とくに母親は仕事への貢献が下がる」という思い込みを問い直した組織心理学の研究です。\n\n・「家族にとっての仕事の意味（FCSMW）」という考え方を新しく提案：仕事を、家族に自分の職業倫理を示し、子どもの手本になる手段としてとらえる度合い\n・その尺度を作って検証したうえで、中国の2つの現場データ（複数の情報源）と米国の1つの現場データで確かめた\n・親は親でない人よりFCSMWが高く、その差は女性でより大きかった\n・FCSMWが高い人ほど、仕事への努力や組織市民行動（頼まれていない手助けなど）が多かった\n・親であることが仕事ぶりにつながる効果は、男性より女性で強かった\n\n⚠️限界：抄録には効果の大きさの数字がなく、どれくらいの差かは分からない。中国・米国のデータで、日本の職場で同じかは確かめられていない。\n\n💼経営の一言：子育て中のスタッフを「時短で戦力が落ちる人」と見るのは損かもしれない。家族に胸を張れる仕事だと感じてもらえる声かけや、働き方の工夫が定着にもつながりそう。\n\n📄 J Appl Psychol 2026 DOI:10.1037/apl0001355\n#クリニック経営 #組織づくり", "x_href": "https://x.com/intent/post?text=%E3%80%90%E5%AD%90%E8%82%B2%E3%81%A6%E4%B8%AD%E3%81%AE%E8%81%B7%E5%93%A1%E3%80%81%E3%81%A8%E3%81%8F%E3%81%AB%E6%AF%8D%E8%A6%AA%E3%81%AF%E3%80%8C%E5%AE%B6%E6%97%8F%E3%81%AB%E8%AA%87%E3%82%8C%E3%82%8B%E4%BB%95%E4%BA%8B%E3%80%8D%E3%81%8C%E3%82%84%E3%82%8B%E6%B0%97%E3%81%AE%E6%BA%90%E3%81%AB%21%3F%E3%80%91%0A%0A2026%E5%B9%B42%E6%9C%88%E3%81%AE%E7%A0%94%E7%A9%B6%E3%81%A7%E3%81%99%E3%81%8C%E3%80%81%E3%80%8C%E5%AD%90%E8%82%B2%E3%81%A6%E4%B8%AD%E3%81%AE%E4%BA%BA%E3%80%81%E3%81%A8%E3%81%8F%E3% e": null, "why": "組織行動論（採用・定着）のテーマで、子育て中のスタッフが多い医療現場にそのまま置きかえやすいため。"}, {"id": "2026-09-25-7", "n": 7, "category": "happiness", "badges": ["😊 📅"], "body": "【「夢中になる時間」は、楽しさより「生きがい」に効く!?】\n\n2026年3月の研究ですが、活動に深く没入する「フロー」体験と幸福感の関係をまとめたメタ解析です。\n\n・フローと幸福感には、中程度に強い正の関連があった\n・「楽しい・気分がよい」といった快楽の幸福より、「意味・生きがい」の幸福（ユーダイモニア）のほうが関連が強かった\n・快楽の幸福の中でも、気分そのものより「人生に満足している」という評価のほうが強く関連\n・不安などネガティブな面の少なさより、ポジティブな面との関連が強い\n・どんな活動か、研究デザイン、対象者の特徴によらず、関連はおどろくほど頑健だった\n\n⚠️限界：関連をみた研究で、フローが幸福を「生む」とまでは言えない（幸せな人がフローに入りやすい可能性もある）。抄録には研究の数や効果の大きさの数字がない。\n\n😊暮らしの一言：仕事でも趣味でも、時間を忘れて没頭できる時間は「気晴らし」以上に、人生の意味の感覚につながっていそう。1日の中に夢中になれる時間を守ってみては。\n\n📄 Emotion 2026 DOI:10.1037/emo0001657\n#ポジティブ心理学 #幸福学", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%80%8C%E5%A4%A2%E4%B8%AD%E3%81%AB%E3%81%AA%E3%82%8B%E6%99%82%E9%96%93%E3%80%8D%E3%81%AF%E3%80%81%E6%A5%BD%E3%81%97%E3%81%95%E3%82%88%E3%82%8A%E3%80%8C%E7%94%9F%E3%81%8D%E3%81%8C%E3%81%84%E3%80%8D%E3%81%AB%E5%8A%B9%E3%81%8F%21%3F%E3%80%91%0A%0A2026%E5%B9%B43%E6%9C%88%E3%81%AE%E7%A0%94%E7%A9%B6%E3%81%A7%E3%81%99%E3%81%8C%E3%80%81%E6%B4%BB%E5%8B%95%E3%81%AB%E6%B7%B1%E3%81%8F%E6%B2%A1%E5%85%A5%E3%81%99%E3%82%8B%E3%80%8C%E3%83%95%E3%83%AD%E3%83%BC%E3%80%8D%E4%BD%93%E9%A8%93%E3%81%A8%E5%B9%B8%E7%A6%8F%E6%84%9F%E3%81%AE%E9%96%A2%E4%BF%82%E3%82%92%E3%81%BE%E3%81%A8%E3%82%81%E3%81%9F%E3%83%A1%E3%82%BF%E8%A7%A3%E6%9E%90%E3%81%A7%E3%81%99%E3%80%82%0A%0A%E3%83%BB%E3%83%95%E3%83%AD%E3%83%BC%E3%81%A8%E5%B9%B8%E7%A6%8F%E6%84%9F%E3%81%AB%E3%81%AF%E3%80%81%E4%B8%AD%E7%A8%8B%E5%BA%A6%E3%81%AB%E5%BC%B7%E3%81%84%E6%AD%A3%E3%81%AE%E9%96%A2%E9%80%A3%E3%81%8C%E3%81%82%E3%81%A3%E3%81%9F%0A%E3%83%BB%E3%80%8C%E6%A5%BD%E3%81%97%E3%81%84%E3%83%BB%E6%B0%97%E5%88%86%E3%81%8C%E3%82%88%E3%81%84%E3%80%8D%E3%81%A8%E3%81%84%E3%81%A3%E3%81%9F%E5%BF%AB%E6%A5%BD%E3%81%AE%E5%B9%B8%E7%A6%8F%E3%82%88%E3%82%8A%E3%80%81%E3%80%8C%E6%84%8F%E5%91%B3%E3%83%BB%E7%94%9F%E3%81%8D%E3%81%8C%E3%81%84%E3%80%8D%E3%81%AE%E5%B9%B8%E7%A6%8F%EF%BC%88%E3%83%A6%E3%83%BC%E3%83%80%E3%82%A4%E3%83%A2%E3%83%8B%E3%82%A2 2754817/"}, {"title": "Physicians' Beliefs About Treating Asymptomatic Elevated Blood Pressure Readings Among Hospitalized Patients.（J Gen Intern Med）", "url": "https://pubmed.ncbi.nlm.nih.gov/42760462/"}, {"title": "Higher and Lower Intensity Outreach to Increase Enrollment in a Medicaid Food Is Medicine Program: A Randomized Controlled Trial.（J Gen Intern Med）", "url": "https://pubmed.ncbi.nlm.nih.gov/42768178/"}]}, "2026-09-24": {"label": "2026-09-24（木）・6本", "posts": [{"id": "2026-09-24-1", "n": 1, "category": "medical", "badges": [], "body": "【NT-proBNPが2万超え、いちばん多い主病名は心不全ではなく「感染症」!?】\n\nNT-proBNPが20,000 pg/mL以上だった成人の入院415例を調べた後ろ向きコホート研究。どんな診断が多く、予後はどうだったかをみた。\n\n・年齢中央値82歳、NT-proBNP中央値35,000 pg/mL\n・画像所見は肺うっ血55.4%、感染53.7%\n・主病名は感染症が60%で最多、心不全は19%\n・死亡率は院内43.6%、6か月で64.5%。死因の71%が感染症\n・感染症が主病名の人は他の診断より死亡率が有意に高く、高齢と低アルブミンが独立した死亡の予測因子\n\n⚠️限界：約400例の後ろ向き研究。20,000 pg/mL以上の人だけを見ており、心不全の診断精度そのものは評価していない。腎機能などの影響は抄録からは分からない。\n\n🏠在宅医の一言：高齢者で「BNPが著明高値＝心不全」と決めつけず、まず感染を探したい。超高値は予後が厳しい目印でもあるので、ご本人・ご家族と今後の話をするきっかけにもなりそう。\n\n📄 J Gen Intern Med 2026 DOI:10.1007/s11606-026-10830-8\n#総合内科 #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90NT-proBNP%E3%81%8C2%E4%B8%87%E8%B6%85%E3%81%88%E3%80%81%E3%81%84%E3%81%A1%E3%81%B0%E3%82%93%E5%A4%9A%E3%81%84%E4%B8%BB%E7%97%85%E5%90%8D%E3%81%AF%E5%BF%83%E4%B8%8D%E5%85%A8%E3%81%A7%E3%81%AF%E3%81%AA%E3%81%8F%E3%80%8C%E6%84%9F%E6%9F%93%E7%97%87%E3%80%8D%21%3F%E3%80%91%0A%0ANT-proBNP%E3%81%8C20%2C000%20pg%2FmL%E4%BB%A5%E4%B8%8A%E3%81%A0%E3%81%A3%E3%81%9F%E6%88%90%E4%BA%BA%E3%81%AE%E5%85%A5%E9%99%A2415%E4%BE%8B%E3%82%92%E8%AA%BF%E3%81%B9%E3%81%9F%E5%BE%8C%E3%82%8D%E5%90%91%E3%81%8D%E3%82%B3%E3%83%9B%E3%83%BC%E3%83%88%E7%A0%94%E7%A9%B6%E3%80%82%E3%81%A9%E3%82%93%E3%81%AA%E8%A8%BA%E6%96%AD%E3%81%8C%E5%A4%9A%E3%81%8F%E3%80%81%E4%BA%88%E5%BE%8C%E3%81%AF%E3%81%A9%E3%81%86%E3%81%A0%E3%81%A3%E3%81%9F%E3%81%8B%E3%82%92%E3%81%BF%E3%81%9F%E3%80%82%0A%0A%E3%83%BB%E5%B9%B4%E9%BD%A2%E4%B8%AD%E5%A4%AE%E5%80%A482%E6%AD%B3%E3%80%81NT-proBNP%E4%B8%AD%E5%A4%AE %AF%E4%BA%88%E5%BE%8C%E3%81%8C%E5%8E%B3%E3%81%97%E3%81%84%E7%9B%AE%E5%8D%B0%E3%81%A7%E3%82%82%E3%81%82%E3%82%8B%E3%81%AE%E3%81%A7%E3%80%81%E3%81%94%E6%9C%AC%E4%BA%BA%E3%83%BB%E3%81%94%E5%AE%B6%E6%97%8F%E3%81%A8%E4%BB%8A%E5%BE%8C%E3%81%AE%E8%A9%B1%E3%82%92%E3%81%99%E3%82%8B%E3%81%8D%E3%81%A3%E3%81%8B%E3%81%91%E3%81%AB%E3%82%82%E3%81%AA%E3%82%8A%E3%81%9D%E3%81%86%E3%80%82%0A%0A%F0%9F%93%84%20J%20Gen%20Intern%20Med%202026%20DOI%3A10.1007%2Fs11606-026-10830-8%0A%23%E7%B7%8F%E5%90%88%E5%86%85%E7%A7%91%20%23%E5%9C%A8%E5%AE%85%E5%8C%BB%E7%99%82", "paper_url": "https://doi.org/10.1007/s11606-026-10830-8", "figure": null, "why": "超高値のNT-proBNPは心不全より感染症が多いという、高齢者の検査値の読み方を変える実践的な話。予後の厳しさも在宅での話し合いにつながる"}, {"id": "2026-09-24-2", "n": 2, "category": "medical", "badges": [], "body": "【脂肪肝のリスクスコア9種を比べたら、肝硬変の予測はSAFE、肝がん検診の判断にはどれも力不足!?】\n\n米国退役軍人医療(VA)で画像上の脂肪性肝疾患(SLD、ウイルス性肝炎などを除く)と分かった853,131人のコホート研究。9つのリスクスコアが10年以内の肝硬変・肝細胞癌(HCC)をどこまで予測できるかを、決定曲線(net benefit)で比べた。\n\n・10年で肝硬変3.96%、HCC 0.35%\n・肝硬変の識別能はFIB-4・APRI・SAFEが上位\n・net benefitが最大だったのはSAFEスコア。29.5点が10年肝硬変リスク2.5%に相当し、「要注意」とした100人あたり1.9人多く肝硬変を拾える\n・HCCはSAFEでも1000人あたり1.6人の上乗せにとどまり、スコアはHCC検診の判断にほとんど役立たない\n\n⚠️限界：対象の92.7%が男性の退役軍人で、診断は病名コードなどに基づく。日本の外来の集団にそのまま当てはまるかは分からない。\n\n🏠在宅医の一言：健診で「脂肪肝」と言われた人のフォローに、FIB-4に加えてSAFEも候補になりそう。一方、肝がん検診をスコアだけで決めるのは難しい、という割り切りも大事。\n\n📄 JAMA Intern Med 2026 DOI:10.1001/jamainternmed.2026.4110\n#総合内科 #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E8%84%82%E8%82%AA%E8%82%9D%E3%81%AE%E3%83%AA%E3%82%B9%E3%82%AF%E3%82%B9%E3%82%B3%E3%82%A29%E7%A8%AE%E3%82%92%E6%AF%94%E3%81%B9%E3%81%9F%E3%82%89%E3%80%81%E8%82%9D%E7%A1%AC%E5%A4%89%E3%81%AE%E4%BA%88%E6%B8%AC%E3%81%AFSAFE%E3%80%81%E8%82%9D%E3%81%8C%E3%82%93%E6%A4%9C%E8%A8%BA%E3%81%AE%E5%88%A4%E6%96%AD%E3%81%AB%E3%81%AF%E3%81%A9%E3%82%8C%E3%82%82%E5%8A%9B%E4%B8%8D%E8%B6%B3%21%3F%E3%80%91%0A%0A%E7%B1%B3%E5%9B%BD%E9%80%80%E5%BD%B9%E8%BB%8D%E4%BA%BA%E5%8C%BB%E7%99%82%28VA%29%E3%81%A7%E7%94%BB%E5%83%8F%E4%B8%8A%E3%81%AE%E8%84%82%E8%82%AA%E6%80%A7%E8%82%9D%E 8C%E3%82%B1%E3%82%A2%20%23%E5%9C%A8%E5%AE%85%E5%8C%BB%E7%99%82", "paper_url": "https://doi.org/10.1177/02692163261481988", "figure": null, "why": "先生の評価が高かった緩和ケア・看取りのテーマ。「家に帰る」の意味を実存の面から捉え直す、在宅医ならではの視点"}, {"id": "2026-09-24-4", "n": 4, "category": "global", "badges": [], "body": "【結核の「見逃し」を減らす鍵は、国の結核対策の外にいる民間の医療者だった!?】\n\nベトナムの15省(人口4,060万人、全人口の40%)で2020〜2023年に行われた大規模な官民連携(PPM)の介入を、準実験デザインで評価した研究。仲介機関が、国の結核プログラムの外にいる医療者3,154人を、スクリーニング・紹介・報告の仕組みで国の結核対策につないだ。\n\n・介入は1省・1四半期あたり316.8件の結核届出の増加と関連(95%CI 23.4-610.2)\n・全国モデルでは年間3,206件の届出増加\n・介入の強度が高いほど届出が増える、用量反応の関係もみられた\n・届出を1件増やすための費用は166〜458米ドル\n\n⚠️限界：ランダム化ではなく、介入地域は結核の多い省を意図的に選んでいる。届出が増えることが、そのまま治療成績の改善を意味するわけではない。\n\n🌍現場の一言：患者が最初に受診するのは、国の結核窓口ではなく身近な民間の医療者であることも多い。「すでにある医療者のネットワークを、仲介役でつなぐ」発想は、資金の限られる時代に現実的な手だと思う。\n\n📄 PLoS Med 2026 DOI:10.1371/journal.pmed.1005144\n#国際保健 #グローバルヘルス", "x_href": "https://x.com/intent/post?text=%E3%80%90%E7%B5%90%E6%A0%B8%E3%81%AE%E3%80%8C%E8%A6%8B%E9%80%83%E3%81%97%E3%80%8D%E3%82%92%E6%B8%9B%E3%82%89%E3%81%99%E9%8D%B5%E3%81%AF%E3%80%81%E5%9B%BD%E3%81%AE%E7%B5%90%E6%A0%B8%E5%AF%BE%E7%AD%96%E3%81%AE%E5%A4%96%E3%81%AB%E3%81%84%E3%82%8B%E6%B0%91%E9%96%93%E3%81%AE%E5%8C%BB%E7%99%82%E8%80%85%E3%81%A0%E3%81%A3%E3%81%9F%21%3F%E3%80%91%0A%0A%E3%83%99%E3%83%88%E3%83%8A%E3%83%A0%E3%81%AE15%E7%9C%81%28%E4%BA%BA%E5%8F%A34%2C060%E4%B8%87%E4%BA%BA%E3%80%81%E5%85%A8%E4%BA%BA%E5%8F%A3%E3%81%AE40%25%29%E3%81%A72020%E3%80%9C2023%E5%B9%B4%E3%81%AB%E8%A1%8C%E3%82%8F%E3%82%8C%E3%81%9F%E5%A4%A7%E8%A6%8F%E6%A8%A1%E3%81%AA%E5%AE%98%E6%B0%91%E9%80%A3%E6%90%BA%28PPM%29%E3%81%AE%E4%BB%8B%E5%85%A5%E3%82%92%E3%80%81%E6%BA%96%E5%AE%9F%E9%A8%93%E3%83%87%E3%82%B6%E3%82%A4%E3%83%B3%E3%81%A7%E8%A9%95%E4%BE%A1%E3%81%97%E3%81%9F%E7%A0%94%E7%A9%B6%E3%80%82%E4%BB%B2%E4%BB%8B%E6%A9%9F%E9%96%A2%E3%81%8C%E3%80%81%E5%9B%BD%E3%81%AE%E7%B5%90%E6%A0%B8%E3%83%97%E3%83%AD%E3%82%B0%E3%83%A9%E3%83%A0%E3%81%AE%E5%A4%96%E3%81%AB%E3%81%84%E3%82%8B%E5%8C%BB%E7%99%82%E8%80%853%2C154%E4%BA%BA%E3%82%92%E3%80%81%E3%82%B9%E3%82%AF%E3%83%AA%E3%8 る位置から離れる「移動」の経路(16.1%)でもことばの力が関わり、その寄与は「持続」の2倍\n・高校1年(10年生)の学業成績を加えても、上乗せの説明力はなかった\n\n⚠️限界：114人と少なく、98%が白人の英語話者。観察研究なので、ことばの力を伸ばせば将来が変わるかは検証していない。\n\n👶子育ての一言：テストの点数より前の「話す・聞く」力。読み聞かせや日々のおしゃべりを大切にする意味を感じさせる研究。ただ因果はまだ分からないので、親が焦る必要はない。\n\n📄 Child Dev 2026 DOI:10.1093/chidev/aacag175\n#子育て #教育経済学", "x_href": "https://x.com/intent/post?text=%E3%80%90%E5%A4%A7%E4%BA%BA%E3%81%AB%E3%81%AA%E3%81%A3%E3%81%A6%E3%81%8B%E3%82%89%E3%81%AE%E6%9A%AE%E3%82%89%E3%81%97%E5%90%91%E3%81%8D%E3%80%81%E3%81%9D%E3%81%AE%E3%81%B0%E3%82%89%E3%81%A4%E3%81%8D%E3%81%AE%E7%B4%844%E5%88%86%E3%81%AE1%E3%82%92%E5%B9%BC%E7%A8%9A%E5%9C%92%E3%81%AE%E9%A0%83%E3%81%AE%E3%80%8C%E3%81%93%E3%81%A8%E3%81%B0%E3%81%AE%E5%8A%9B%E3%80%8D%E3%81%8C%E8%AA%AC%E6%98%8E%E3%81%97%E3%81%A6%E3%81%84%E3%81%9F%21%3F%E3%80%91%0A%0A%E4%BB%8A%E6%9C%88%E4%B8%8A%E6%97%AC%E3%81%AB%E5%87%BA%E3%81%9F%E7%A0%94%E7%A9%B6%E3%81%A7%E3%81%99%E3%81%8C%E3%80%81%E7%B1%B3%E5%9B%BD%E3%81%A7%E5%B9%BC%E7%A8%9A%E5%9C%92%E3%81%8B%E3%82%8936%E6%AD%B3%E3%81%BE%E3%81%A730%E5%B9%B4%E9%96%93%E8%BF%BD%E3%81%84%E3%81%8B%E3%81%91%E3%81%9F%E7%B8%A6%E6%96%AD%E7%A0%94%E7%A9%B6%28114%E4%BA%BA%29%E3%80%82%E5%B9%BC%E3%81%84%E9%A0%83%E3%81%AE%E3%81%93%E3%81%A8%E3%81%B0%E3%81%AE%E5%8A%9B%E3%80%81%E9%9D%9E%E8%A8%80%E8%AA%9E%E6%80%A7IQ%E3%80%81%E5%AD%A6%E6%A5%AD%E6%88%90%E7%B8%BE%E3%80%81%E5%A4%A7%E4%BA%BA%E3%81%AB%E3%81%AA%E3%81%A3%E3%81%A6%E3%81%8B%E3%82%89%E3%81%AE%E7%A4%BE%E4%BC%9A%E7%B5%8C%E6%B8%88%E7%9A%84%E5%9C%B0%E4%BD%8D%28SES%29%E3%82%92%E6%B8%AC%E3%81%A3%E3%81%9F%E3%80%82%0A%0A%E3%83%BBIQ%E3%81%A8%E3%81%AF%E7%8B%AC%E7%AB%8B%E3%81%97%E3%81%A6%E3%80%81%E5%B9%BC%E5%B0%91%E6%9C%9F%E3%81%AE%E3%81%93%E3%81%A8%E3%81%B0%E3%81%AE%E5%8A%9B%E3%81%8C%E6%88%90%E4%BA%BA%E6%9C%9FSES%E3%81%AE%E3%81%B0%E3%82%89%E3%81%A4%E3%81%8D%E3%81%AE24%25%E3%82%92%E8%AA%AC%E6%98%8E%0A%E3%83%BB%E8%A6%AA%E3%81%AESES%E3%81%8C%E5%AD%90%E3%81%AB%E5%8F%97%E3%81%91%E7%B6%99%E3%81%8C%E3%82%8C%E3%82%8B%E3%80%8C%E6%8C%81%E7%B6%9A%E3%80%8D%E3%81%AE%E7%B5%8C%E8%B7%AF%287.8%25%29%E3%81%A7%E3%8 の話で、医療機関にそのまま当てはまるとは限らない。\n\n💼経営の一言：「いまは経営が苦しいから理念は後回し」は、そのまま戻ってこない危うさがある。理念やクレドを、収益の話と同じ会議の場で扱い続けることが大事かもしれない。\n\n📄 MIT Sloan Management Review 2026 DOI:10.63383/emog9386\n#クリニック経営 #組織づくり", "x_href": "https://x.com/intent/post?text=%E3%80%90%E7%90%86%E5%BF%B5%E3%81%A8%E5%8F%8E%E7%9B%8A%E3%80%81%E3%80%8C%E5%BD%93%E9%9D%A2%E3%81%AF%E3%81%A9%E3%81%A1%E3%82%89%E3%81%8B%E3%82%92%E5%84%AA%E5%85%88%E3%80%8D%E3%81%99%E3%82%8B%E3%83%81%E3%83%BC%E3%83%A0%E3%81%BB%E3%81%A9%E5%A4%B1%E9%80%9F%E3%81%99%E3%82%8B%21%3F%E3%80%91%0A%0AMIT%20Sloan%20Management%20Review%282026%E5%B9%B49%E6%9C%8821%E6%97%A5%29%E3%81%AE%E8%A8%98%E4%BA%8B%E3%80%82%E7%A4%BE%E4%BC%9A%E8%AA%B2%E9%A1%8C%E3%81%AE%E8%A7%A3%E6%B1%BA%E3%82%92%E6%8E%B2%E3%81%92%E3%82%8B%E5%89%B5%E6%A5%AD%E6%9C%9F%E3%81%AE%E3%82%B9%E3%82%BF%E3%83%BC%E3%83%88%E3%82%A2%E3%83%83%E3%83%976%E7%A4%BE%E3%82%92%E3%80%812%E5%B9%B4%E4%BB%A5%E4%B8%8A%E3%83%AA%E3%82%A2%E3%83%AB%E3%82%BF%E3%82%A4%E3%83%A0%E3%81%A7%E8%BF%BD%E3%81%A3%E3%81%9F%E7%A0%94%E7%A9%B6%28Strategic%20Entrepreneurship%20Journal%E3%80%812025%E5%B9%B412%E6%9C%88%29%E3%82%92%E7%B4%B9%E4%BB%8B%E3%81%97%E3%81%A6%E3%81%84%E3%82%8B%E3%80%82%0A%0A%E3%83%BB6%E7%A4%BE%E3%81%AE%E3%81%86%E3%81%A13%E7%A4%BE%E3%81%AF%E7%A0%B4%E7%B6%BB%E3%80%813%E7%A4%BE%E3%81%AF%E6%A6%82%E5%BF%B5%E5%AE%9F%E8%A8%BC%28PoC%29%E3%81%BE%E3%81%A7%E5%88%B0%E9%81%94%0A%E3%83%BB%E6%88%90%E5%90%A6%E3%82%92%E5%88%86%E3%81%91%E3%81%9F%E3%81%AE%E3%81%AF%E3%80%81%E3%83%81%E3%83%BC%E3%83%A0%E3%81%8C%E3%80%8C%E7%90%86%E5%BF%B5%E3%81%A8%E5%8F%8E%E7%9B%8A%E3%80%8D%E3%81%AE%E3%81%9B%E3%82%81%E3%81%8E%E5%90%88%E3%81%84%E3%82%92%E3%81%A9%E3%81%86%E6%8D%89%E3%81%88%E3%82%8B%E3%81%8B%0A%E3%83%BB%E3%80%8C%E5%BD%93%E9%9D%A2%E3%81%AF%E3%81%A9%E3%81%A1%E3%82%89%E3%81%8B%E4%B8%80%E6%96%B9%E3%82%92%E5%84%AA%E5%85%88%E3%81%99%E3%82%8B%28either%2For%29%E3%80%8D%E3%83%81%E3%83%BC%E3%83%A0%E3%82%88%E3%82%8A%E3%80%81%E3%80%8C%E4%B8%A1%E6%96%B9%E3%82%92%E5%90%8C%E6%99%82%E3%81%AB%E8%BF%BD%E3%81%86%28both%2Fand%29%E3%80%8D%E3%83%81%E3%83% %A5%E3%81%8F%E3%82%8A", "paper_url": "https://doi.org/10.63383/emog9386", "figure": null, "why": "9月21日公開の新しい記事。理念（クレド）の浸透と経営の両立という、クリニック経営で自分ごとにしやすいテーマ"}, {"id": "2026-09-23-6", "n": 6, "category": "global", "badges": [], "body": "【アフリカの生活習慣病、死亡「率」は下がったのに死亡「数」は増え続けている!?】\n\n世界の疾病負担研究(GBD 2023)の手法で、1990〜2023年のアフリカにおける非感染性疾患(NCD)の負担とリスク因子を推計した分析。\n\n・2023年のNCDによる死亡は470万人、DALYは2億6,300万\n・1990年から年齢調整死亡率は9.0%下がったが、人口増加と人口構成の変化で、死亡数・DALYの実数は増加\n・死因の上位は虚血性心疾患(80.1万人)、脳卒中(70.0万人)、慢性腎臓病(29.3万人)\n・NCD死亡の57.4%は修正可能なリスク因子によるもので、最大は収縮期高血圧(26.2%)、次いで食事(14.7%)、大気汚染(14.2%)\n\n⚠️限界：口頭剖検など多様なデータを組み合わせたモデル推計で、不確実性の幅がある。国ごとの差は大きく、アフリカ全体の数字では見えない部分もある。\n\n🌍現場の一言：感染症のイメージが強いアフリカでも、死因の上位は心血管疾患。地域の診療所で血圧を測り、治療を続けられる仕組みが、いちばん効率のよい投資になりそう。\n\n📄 Lancet Glob Health 2026 DOI:10.1016/j.langlo.2026.103964\n#国際保健 #グローバルヘルス", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%82%A2%E3%83%95%E3%83%AA%E3%82%AB%E3%81%AE%E7%94%9F%E6%B4%BB%E7%BF%92%E6%85%A3%E7%97%85%E3%80%81%E6%AD%BB%E4%BA%A1%E3%80%8C%E7%8E%87%E3%80%8D%E3%81%AF%E4%B8%8B%E3%81%8C%E3%81%A3%E3%81%9F%E3%81%AE%E3%81%AB%E6%AD%BB%E4%BA%A1%E3%80%8C%E6%95%B0%E3%80%8D%E3%81%AF%E5%A2%97%E3%81%88%E7%B6%9A%E3%81%91%E3%81%A6%E3%81%84%E3%82%8B%21%3F%E3%80%91%0A%0A%E4%B8%96%E7%95%8C%E3%81%AE%E7%96%BE%E7%97%85%E8%B2%A0%E6%8B%85%E7%A0%94%E7%A9%B6%28GBD%202023%29%E3%81%AE%E6%89%8B%E6%B3%95%E3%81%A7%E3%80%811990%E3%80%9C2023%E5%B9%B4%E3%81%AE%E3%82%A2%E3%83%95%E3%83%AA%E3%82%AB%E3%81%AB%E3%81%8A%E3%81%91%E3%82%8B%E9%9D%9E%E6%84%9F%E6%9F%93%E6%80%A7%E7%96%BE%E6%82%A3%28NCD%29%E3%81%AE%E8%B2%A0%E6%8B%85%E3%81%A8%E3%83%AA%E3%82%B9%E3%82%AF%E5%9B%A0%E5%AD%90%E3%82%92%E6%8E%A8%E8%A8%88%E3%81%97%E3%81%9F%E5%88%86%E6%9E%90%E3%80%82%0A%0A%E3%83%BB2023%E5%B9%B4%E3%81%AENCD%E3%81%AB%E3%82%88%E3%82%8B%E6%AD%BB%E4%BA%A1%E3%81%AF470%E4%B8%87%E4%BA%BA%E3%80%81DALY%E3%81%AF2%E5%84%846%2C300%E4%B8%87%0A%E3%83%BB1990%E5%B9%B4%E3%81%8B%E3%82%89%E5%B9%B4%E9%BD%A2%E8%AA%BF%E6%95%B4%E6%AD%BB%E4%BA%A1%E7%8E%87%E3%81%AF9.0%25%E4%B8%8B%E3%81%8C%E3%81%A3%E3%81%9F%E3%81%8C%E3% E3%81%A7%E8%A1%80%E5%9C%A7%E3%82%92%E6%B8%AC%E3%82%8A%E3%80%81%E6%B2%BB%E7%99%82%E3%82%92%E7%B6%9A%E3%81%91%E3%82%89%E3%82%8C%E3%82%8B%E4%BB%95%E7%B5%84%E3%81%BF%E3%81%8C%E3%80%81%E3%81%84%E3%81%A1%E3%81%B0%E3%82%93%E5%8A%B9%E7%8E%87%E3%81%AE%E3%82%88%E3%81%84%E6%8A%95%E8%B3%87%E3%81%AB%E3%81%AA%E3%82%8A%E3%81%9D%E3%81%86%E3%80%82%0A%0A%F0%9F%93%84%20Lancet%20Glob%20Health%202026%20DOI%3A10.1016%2Fj.langlo.2026.103964%0A%23%E5%9B%BD%E9%9A%9B%E4%BF%9D%E5%81%A5%20%23%E3%82%B0%E3%83%AD%E3%83%BC%E3%83%90%E3%83%AB%E3%83%98%E3%83%AB%E3%82%B9", "paper_url": "https://doi.org/10.1016/j.langlo.2026.103964", "figure": null, "why": "Lancet Glob Healthの大規模推計。「率は下がっても数は増える」という逆説と、高血圧が最大の要因という実践的な示唆"}, {"id": "2026-09-23-7", "n": 7, "category": "happiness", "badges": ["😊 📅"], "body": "【幸せを高める方法、いちばん効くのは「運動＋心のトレーニング」の組み合わせ!?】\n\n2026年1月の研究ですが、病気の診断のない成人を対象に、幸福度(ウェルビーイング)を高める介入を比べたRCTの系統的レビュー・ネットワークメタ解析(183試験、22,811人)。\n\n・ほとんどの介入が、何もしない対照より幸福度を改善\n・効果が最大だったのは、運動と心理的介入の組み合わせ(SMD 0.73、95%CI 0.27-1.20)\n・マインドフルネス、コンパッション、単独のポジティブ心理学介入、ヨガ、運動は、いずれも中等度で安定した効果(SMD 0.41〜0.49)で、互いに差はなし\n・自然に触れるプログラムは、対照と有意差なし(研究のばらつきが大きく、根拠は限定的)\n\n⚠️限界：バイアスリスクが中〜高の試験が多く、出版バイアスの可能性もある(感度分析では結論は変わらず)。検索は2023年3月まで。\n\n😊暮らしの一言：どれか1つの「正解」を探すより、続けやすいものを選べばよさそう。歩きながら良かったことを思い返すなど、体と心を組み合わせるとさらに効くかもしれない。\n\n📄 Nat Hum Behav 2026 DOI:10.1038/s41562-025-02369-1\n#ポジティブ心理学 #幸福学", "x_href": "https://x.com/intent/post?text=%E3%80%90%E5%B9%B8%E3%81%9B%E3%82%92%E9%AB%98%E3%82%81%E3%82%8B%E6%96%B9%E6%B3%95%E3%80%81%E3%81%84%E3%81%A1%E3%81%B0%E3%82%93%E5%8A%B9%E3%81%8F%E3%81%AE%E3%81%AF%E3%80%8C%E9%81%8B%E5%8B%95%EF%BC%8B%E5%BF%83%E3%81%AE%E3%83%88%E3%83%AC%E3%83%BC%E3%83%8B%E3%83%B3%E3%82%B0%E3%80%8D%E3%81%AE%E7%B5%84%E3%81%BF%E5%90%88%E3%82%8F%E3%81%9B%21%3F%E3%80%91%0A%0A2026%E5%B9%B41%E6%9C%88%E3%81%AE%E7%A0%94%E7%A9%B6%E3%81%A7%E3%81%99%E3%81%8C%E3%80%81%E7%97%85%E6%B0%97%E3%81%AE%E8%A8%BA%E6%96%AD%E3%81%AE%E3%81%AA%E3%81%84%E6%88%90%E4%BA%BA%E3%82%92%E5%AF%BE%E8%B1%A1%E3%81%AB%E3%80%81%E5%B9%B8%E7%A6%8F%E5%BA%A6%28%E3 ospitalized Patients.（J Gen Intern Med）", "url": "https://pubmed.ncbi.nlm.nih.gov/42760462/"}, {"title": "Extreme Temperatures, Elevated PM2.5, and Acute Care Events Among Dual-Eligible Nursing Facility Residents.（J Am Geriatr Soc）", "url": "https://pubmed.ncbi.nlm.nih.gov/42760629/"}, {"title": "The Mean and Variability of Morning Hour Activity Over 2-3 Days Predict 5-Year Mortality and Frailty Risk.（J Am Geriatr Soc）", "url": "https://pubmed.ncbi.nlm.nih.gov/42754817/"}, {"title": "Controlled Drug Use and Falls in Older People With Neurogenic Claudication: Secondary Analysis of the BOOST RCT.（J Am Geriatr Soc）", "url": "https://pubmed.ncbi.nlm.nih.gov/42755166/"}, {"title": "Exercise-based cardiac rehabilitation for coronary heart disease.（Cochrane Database Syst Rev）", "url": "https://pubmed.ncbi.nlm.nih.gov/42754260/"}, {"title": "Higher and Lower Intensity Outreach to Increase Enrollment in a Medicaid Food Is Medicine Program: A Randomized Controlled Trial.（J Gen Intern Med）", "url": "https://pubmed.ncbi.nlm.nih.gov/42768178/"}, {"title": "Implementation factors of group antenatal care in low-resource settings in Tanzania.（PLOS Glob Public Health）", "url": "https://pubmed.ncbi.nlm.nih.gov/42758772/"}, {"title": "Quantifying excess TB prevalence among people living with HIV on ART in the universal ART era.（PLOS Glob Public Health）", "url": "https://pubmed.ncbi.nlm.nih.gov/42766564/"}]}, "2026-09-22": {"label": "2026-09-22（火）・7本", "posts": [{"id": "2026-09-22-1", "n": 1, "category": "medical", "badges": [], "body": "【多因子転倒予防プログラム、「転ぶ人の割合」はほとんど減らせない!?】\n\n地域在住高齢者(60歳以上)を対象に、個々のリスク因子に応じて内容を変える「多因子介入」の効果を検証したコクランの系統的レビュー・メタ解析(110件のRCT、48,919人)。\n\n・多因子介入 vs 通常ケア/アテンションコントロール：転倒率は減少(RaR 0.76、95%CI 0.67-0.87)、再発転倒のリスクも減少(RR 0.87、0.78-0.98)\n・しかし「転倒する人の割合」自体にはほとんど効果なし(RR 0.95、0.90-1.01)\n・転倒予防のアドバイス/教育と比べると、多因子介入は転倒率をむしろ小幅に増やす可能性(RaR 1.09、1.00-1.18、中等度の確実性)\n\n⚠️限界：エビデンスの確実性の多くは低〜中等度で、研究間のばらつきが大きい(I²最大92%)。比較の組み合わせによって結論が異なる。\n\n🏠在宅医の一言：手厚い多因子介入でも「転ぶ人自体を減らす」のは簡単ではなさそう。目標を「転倒回数を減らす」のか「転ばない人を増やす」のか、家族と話すときに整理して伝えたい。\n\n📄 Cochrane Database Syst Rev 2026 DOI:10.1002/14651858.CD012221.pub3\n#総合内科 #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E5%A4%9A%E5%9B%A0%E5%AD%90%E8%BB%A2%E5%80%92%E4%BA%88%E9%98%B2%E3%83%97%E3%83%AD%E3%82%B0%E3%83%A9%E3%83%A0%E3%80%81%E3%80%8C%E8%BB%A2%E3%81%B6%E4%BA%BA%E3%81%AE%E5%89%B2%E5%90%88%E3%80%8D%E3%81%AF%E3%81%BB%E3%81%A8%E3%82%93%E3%81%A9%E6%B8%9B%E3%82%89%E3%81%9B%E3%81%AA%E3%81%84%21%3F%E3%80%91%0A%0A%E5%9C%B0%E5%9F%9F%E5%9C%A8%E4%BD%8F%E9%AB%98%E9%BD%A2%E8%80%85%2860%E6%AD%B3%E4%BB%A5%E4%B8%8A%29%E3%82%92%E5%AF%BE%E8%B1%A1%E3%81%AB%E3%80%81%E5%80%8B%E3%80%85%E3%81%AE%E3%83%AA%E3%82%B9%E3%82%AF%E5%9B%A0%E5%AD%90%E3%81%AB%E5%BF%9C%E3%81%98%E3%81%A6%E5%86%85%E5%AE%B9%E3%82%92%E5%A4%89%E3%81%88%E3%82%8B%E3%80%8C%E5%A4%9A%E5%9B%A0%E5%AD%90%E4%BB%8B%E5%85%A5%E3%80%8D%E3%81%AE%E5%8A%B9%E6%9E%9C%E3%82%92%E6%A4%9C%E8%A8%BC%E3%81%97%E3%81%9F%E3%82%B3%E3%82%AF%E3%83%A9%E3%83%B3%E3%81%AE%E7%B3%BB%E7%B5%B1%E7%9A%84%E3%83%AC%E3%83%93%E3%83%A5%E3%83%BC%E3%83%BB%E3%83%A1%E3%82%BF%E8%A7%A3%E6%9E%90%28110%E4%BB%B6%E3%81%AERCT%E3%80%8148%2C919%E4%BA%BA%29%E3%80%82%0A%0A%E3%83%BB%E5%A4%9A%E5%9B%A0%E5%AD%90%E4%BB%8B%E5%85%A5%20vs%20%E9%80%9A%E5%B8%B8%E3%82%B1%E3%82%A2%2F%E3%82%A2%E3%83%86%E3%83%B3%E3%82%B7%E3%83%A7%E3%83%B3%E3%82%B3%E3%83%B3%E3%83%88%E3%83%AD%E3%83%BC%E3%83%AB%EF%BC%9A%E8%BB%A2%E5%80%92%E7%8E%87%E3%81%AF%E6%B8%9B%E5%B0%91%28RaR%200.76%E3%80%8195%25CI%200.67-0.87%29%E3%80%81%E5%86%8D%E7%99%BA%E8%BB%A2%E5%80%92%E3%81%AE%E3%83%AA%E3%82%B9%E3%82%AF%E3%82%82%E6%B8%9B%E5%B0%91%28RR%200.87%E3%80%810.78-0.98%29%0A%E3%83%BB%E3%81%97%E3%81%8B%E3%81%97%E3%80%8C%E8%BB%A2%E5%80%92%E3%81%99%E3%82%8B%E4%BA%BA%E3%81%AE%E5%89%B2%E5%90%88%E3%80%8D%E8%87%AA%E4%BD%93%E3%81%AB%E3%81%AF%E3%81%BB%E3%81%A8%E3%82%93%E3%81%A9%E5%8A%B9%E6%9E%9C%E3%81%AA%E3%81%97%28RR%200.95%E3%80%810.90-1.01%29%0A%E3%83%BB%E8%BB%A2%E5%80%92%E4%BA%88%E9%98%B2%E3%81%AE%E3%82%A2%E3%83%89%E3%83%90%E3%82%A4%E3%82%B9%2F%E6%95%99%E8%82%B2%E 子介入=転倒予防に効く」という前提を見直すきっかけになる"}, {"id": "2026-09-22-2", "n": 2, "category": "medical", "badges": [], "body": "【「噛みにくい」「飲み込みにくい」だけで、死亡リスクが1.5倍!?】\n\n岡山市の健診データを使った日本の大規模コホート研究。65歳以上の地域在住高齢者52,789人を対象に、基本チェックリストの口腔機能スコア(咀嚼困難・嚥下困難・口腔乾燥の3項目、0〜3点)と全死亡の関連をみた。\n\n・スコア1点：調整後HR 1.09(95%CI 1.04-1.13)\n・スコア2点：HR 1.26(1.20-1.32)\n・スコア3点：HR 1.49(1.38-1.60)\n・咀嚼困難(HR 1.19)と嚥下困難(HR 1.18)は独立して死亡と関連。口腔乾燥は有意でなかった(HR 1.02)\n\n⚠️限界：観察研究で自己申告ベース。2006〜2007年度の健診で古いデータ。他地域にそのまま当てはまるとは限らない。\n\n🏠在宅医の一言：問診で「噛みにくい」「むせる」を聞くだけでも、予後を見立てる手がかりになりそう。基本チェックリストは在宅・外来どちらでもすぐ使える。\n\n📄 J Am Geriatr Soc 2026 DOI:10.1111/jgs.70714\n#総合内科 #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%80%8C%E5%99%9B%E3%81%BF%E3%81%AB%E3%81%8F%E3%81%84%E3%80%8D%E3%80%8C%E9%A3%B2%E3%81%BF%E8%BE%BC%E3%81%BF%E3%81%AB%E3%81%8F%E3%81%84%E3%80%8D%E3%81%A0%E3%81%91%E3%81%A7%E3%80%81%E6%AD%BB%E4%BA%A1%E3%83%AA%E3%82%B9%E3%82%AF%E3%81%8C1.5%E5%80%8D%21%3F%E3%80%91%0A%0A%E5%B2%A1%E5%B1%B1%E5%B8%82%E3%81%AE%E5%81%A5%E8%A8%BA%E3%83%87%E3%83%BC%E3%82%BF%E3%82%92%E4%BD%BF%E3%81%A3%E3%81%9F%E6%97%A5%E6%9C%AC%E3%81%AE%E5%A4%A7%E8%A6%8F%E6%A8%A1%E3%82%B3%E3%83%9B%E3%83%BC%E3%83%88%E7%A0%94%E7%A9%B6%E3%80%8265%E6%AD%B3%E4%BB%A5%E4%B8%8A%E3%81%AE%E5%9C%B0%E5%9F%9F%E5%9C%A8%E4%BD%8F%E9%AB%98%E9%BD%A2%E8%80%8552%2C789%E4%BA%BA%E3%82%92%E5%AF%BE%E8%B1%A1%E3%81%AB%E3%80%81%E5%9F%BA%E6%9C%AC%E3%83%81%E3%82%A7%E3%83%83%E3%82%AF%E3%83%AA%E3%82%B9%E3%83%88%E3%81%AE%E5%8F%A3%E8%85%94%E6%A9%9F%E8%83%BD%E3%82%B9%E3%82%B3%E3%82%A2%28%E5%92%80%E5%9A%BC%E5%9B%B0%E9%9B%A3%E3%83%BB%E5%9A%A5%E4%B8%8B%E5%9B%B0%E9%9B%A3%E3%83%BB%E5%8F%A3%E8%85%94%E4%B9%BE%E7%87%A5%E3%81%AE3%E9%A0%85%E7%9B%AE%E3%80%810%E3%80%9C3%E7%82%B9%29%E3%81%A8%E5%85%A8%E6%AD%BB%E4%BA%A1%E3%81%AE%E9%96%A2%E9%80%A3%E3%82%92%E3%81%BF%E3%81%9F%E3%80%82%0A%0A%E3%83%BB%E3%82%B9%E3%82%B3%E3%82%A21%E7%82%B9%EF%BC%9A%E8%AA%BF%E6%95%B4%E5%BE%8CHR%201.09%2895%25CI%201.04-1.13%29%0A%E3%83%BB%E3%82%B9%E3%82%B3%E3%82%A22%E7%82%B9%EF%BC%9AHR%201.26%281.20-1.32%29%0A%E3%83%BB%E3%82%B9%E3%82%B の意見箱、1on1など)を用意したい。\n\n📄 J Appl Psychol 2025 DOI:10.1037/apl0001316\n#クリニック経営 #組織づくり", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%80%8C%E6%84%8F%E8%A6%8B%E3%82%92%E8%A8%80%E3%81%86%E4%BA%BA%E3%80%8D%E3%81%AF%E3%80%81%E6%85%8E%E9%87%8D%E3%81%AA%E4%BA%BA%E3%82%88%E3%82%8A%E6%80%9D%E3%81%84%E5%88%87%E3%81%A3%E3%81%9F%E6%80%A7%E6%A0%BC%E3%81%AE%E4%BA%BA%E3%81%AB%E5%A4%9A%E3%81%84%21%3F%E3%80%91%0A%0A2025%E5%B9%B410%E6%9C%88%E3%81%AE%E7%A0%94%E7%A9%B6%E3%81%A7%E3%81%99%E3%81%8C%E3%80%81%E8%81%B7%E5%A0%B4%E3%81%A7%E3%81%AE%E3%80%8C%E7%B5%B1%E5%88%B6%E3%81%AE%E6%89%80%E5%9C%A8%28LOC%29%E3%80%8D%28%E8%87%AA%E5%88%86%E3%81%A7%E3%82%B3%E3%83%B3%E3%83%88%E3%83%AD%E3%83%BC%E3%83%AB%E3%81%A7%E3%81%8D%E3%82%8B%E3%81%A8%E6%80%9D%E3%81%86%E3%81%8B%E3%80%81%E5%A4%96%E9%83%A8%E8%A6%81%E5%9B%A0%E3%81%AB%E5%B7%A6%E5%8F%B3%E3%81%95%E3%82%8C%E3%82%8B%E3%81%A8%E6%80%9D%E3%81%86%E3%81%8B%E3%81%AE%E5%82%BE%E5%90%91%29%E3%81%A8%E3%80%81%E5%95%8F%E9%A1%8C%E3%82%92%E6%8C%87%E6%91%98%E3%81%99%E3%82%8B%E3%80%8C%E6%8A%91%E6%AD%A2%E7%9A%84%E7%99%BA%E8%A8%80%E3%80%8D%E3%81%AE%E9%96%A2%E4%BF%82%E3%82%92%E8%AA%BF%E3%81%B9%E3%81%9F2%E3%81%A4%E3%81%AE%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E3%83%89%E8%AA%BF%E6%9F%BB%E3%80%82%0A%0A%E3%83%BBLOC%E3%81%8C%E5%BC%B7%E3%81%8F%E5%86%85%E7%9A%84%28%E8%87%AA%E5%88%86%E3%81%A7%E6%B1%BA%E3%82%81%E3%82%89%E3%82%8C%E3%82%8B%E3%81%A8%E6%80%9D%E3%81%86%29%E3%80%81%E3%81%BE%E3%81%9F%E3%81%AF%E5%BC%B7%E3%81%8F%E5%A4%96%E7%9A%84%28%E5%A4%96%E9%83%A8%E8%A6%81%E5%9B%A0%E6%AC%A1%E7%AC%AC%E3%81%A8%E6%80%9D%E3%81%86%29%E3%81%AA%E4%BA%BA%E3%81%BB%E3%81%A9%E3%80%81%E7%99%BA%E8%A8%80%E3%81%AE%E3%83%AA%E3%82%B9%E3%82%AF%E3%82%92%E4%BD%8E%E3%81%8F%E6%84%9F%E3%81%98%E3%80%81%E6%8A%91%E6%AD%A2%E7%9A%84%E7%99%BA%E8%A8%80%E3%82%92%E3%81%97%E3%82%84%E3%81%99%E3%81%84U%E5%AD%97%E5%9E%8B%E3%81%AE%E9%96%A2%E4%BF%82%0A%E3%83%BB%E4%B8%AD%E9%96%93%E7%9A%84%E3%81%AALOC%E3%81%AE%E4%BA%BA%E3%81%8C%E3%82%82%E3%81%A3%E3%81%A8%E3%82%82%E7%99%BA%E8%A8%80%E3%82%92%E6%8E%A7%E3%81%88%E3%82%84 -09-22-5", "n": 5, "category": "business", "badges": ["💼 📅"], "body": "【「登録医」の4人に1人以上が、実は1人も診ていなかった!?】\n\n2026年2月の研究ですが、米国の医師登録データとメディケイド(低所得者向け公的医療保険)の診療実績データを突き合わせた分析(循環器・皮膚科・眼科・プライマリケア・精神科の5専門科、2019〜2021年)。\n\n・メディケイドに登録していた医師の68〜89%のうち、2021年に実際に患者を1人も診なかった「ゴースト医師」が約28%\n・精神科医は特に多く、4割超がゴースト医師\n・プライマリケア医は逆に「コア参加者(高頻度で診療)」の割合が高い\n・約2割のゴースト医師、3割の「周辺的参加者」は翌年により多く診るグループへ移行していた\n\n⚠️限界：米国メディケイド制度に特有の分析で、日本の保険制度にそのまま当てはまらない。登録から離れない理由(名簿の未更新など)までは分からない。\n\n💼経営の一言：「名簿に載っている＝機能している」とは限らない。連携医・紹介先リストなども、実際に動いているかを定期的に見直す価値がありそう。\n\n📄 Health Aff (Millwood) 2026 DOI:10.1377/hlthaff.2025.00703\n#クリニック経営 #組織づくり", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%80%8C%E7%99%BB%E9%8C%B2%E5%8C%BB%E3%80%8D%E3%81%AE4%E4%BA%BA%E3%81%AB1%E4%BA%BA%E4%BB%A5%E4%B8%8A%E3%81%8C%E3%80%81%E5%AE%9F%E3%81%AF1%E4%BA%BA%E3%82%82%E8%A8%BA%E3%81%A6%E3%81%84%E3%81%AA%E3%81%8B%E3%81%A3%E3%81%9F%21%3F%E3%80%91%0A%0A2026%E5%B9%B42%E6%9C%88%E3%81%AE%E7%A0%94%E7%A9%B6%E3%81%A7%E3%81%99%E3%81%8C%E3%80%81%E7%B1%B3%E5%9B%BD%E3%81%AE%E5%8C%BB%E5%B8%AB%E7%99%BB%E9%8C%B2%E3%83%87%E3%83%BC%E3%82%BF%E3%81%A8%E3%83%A1%E3%83%87%E3%82%A3%E3%82%B1%E3%82%A4%E3%83%89%28%E4%BD%8E%E6%89%80%E5%BE%97%E8%80%85%E5%90%91%E3%81%91%E5%85%AC%E7%9A%84%E5%8C%BB%E7%99%82%E4%BF%9D%E9%99%BA%29%E3%81%AE%E8%A8%BA%E7%99%82%E5%AE%9F%E7%B8%BE%E3%83%87%E3%83%BC%E3%82%BF%E3%82%92%E7%AA%81%E3%81%8D%E5%90%88%E3%82%8F%E3%81%9B%E3%81%9F%E5%88%86%E6%9E%90%28%E5%BE%AA%E7%92%B0%E5%99%A8%E3%83%BB%E7%9A%AE%E8%86%9A%E7%A7%91%E3%83%BB%E7%9C%BC%E7%A7%91%E3%83%BB%E3%83%97%E3%83%A9%E3%82%A4%E3%83%9E%E3%83%AA%E3%82%B1%E3%82%A2%E3%83%BB%E7%B2%BE%E7%A5%9E%E7%A7%91%E3%81%AE5%E5%B0%82%E9%96%80%E7%A7%91%E3%80%812019%E3%80%9C2021%E5%B9%B4%29%E3%80%82%0A%0A%E3%83%BB%E3%83%A1%E3%83%87%E3%82%A3%E3%82%B1%E3%82%A4%E3%83%89%E3%81%AB%E7%99%BB%E9%8C%B2%E3%81%97%E3%81%A6%E3%81%84%E3%81%9F%E5%8C%BB%E5%B8%AB%E3%81%AE68%E3%80%9C89%25%E3%81%AE%E3%81%86%E3%81%A1%E3%80%812021%E5%B9%B4%E3%81%AB%E5%AE%9F%E9%9A%9B%E3%81%AB%E6%82%A3%E8%80%85%E3%82%921%E4%BA%BA%E3%82%82%E 2%B9%E3%83%88%E3%81%AA%E3%81%A9%E3%82%82%E3%80%81%E5%AE%9F%E9%9A%9B%E3%81%AB%E5%8B%95%E3%81%84%E3%81%A6%E3%81%84%E3%82%8B%E3%81%8B%E3%82%92%E5%AE%9A%E6%9C%9F%E7%9A%84%E3%81%AB%E8%A6%8B%E7%9B%B4%E3%81%99%E4%BE%A1%E5%80%A4%E3%81%8C%E3%81%82%E3%82%8A%E3%81%9D%E3%81%86%E3%80%82%0A%0A%F0%9F%93%84%20Health%20Aff%20%28Millwood%29%202026%20DOI%3A10.1377%2Fhlthaff.2025.00703%0A%23%E3%82%AF%E3%83%AA%E3%83%8B%E3%83%83%E3%82%AF%E7%B5%8C%E5%96%B6%20%23%E7%B5%84%E7%B9%94%E3%81%A5%E3%81%8F%E3%82%8A", "paper_url": "https://doi.org/10.1377/hlthaff.2025.00703", "figure": null, "why": "「登録＝機能」ではないという意外性が強く、連携先の実態把握という経営課題に直結する"}, {"id": "2026-09-22-6", "n": 6, "category": "global", "badges": [], "body": "【結核の地域検診、AI読影だけの方が追加検査より安く見つけられる!?】\n\n南アフリカとレソトの地域密着型・結核アクティブケースファインディング(TB TRIAGE+試験、2022〜2024年)。AIによる胸部X線コンピュータ支援検出(CAD4TBv7)単独と、CRP検査を追加した戦略のコストを比較した経済分析。\n\n・対象20,023人(南ア6,986人、レソト13,037人)、結核はCAD単独で72人、CAD+CRPで60人検出\n・結核1例あたりの検出コスト：CAD単独 5,454ドル、CAD+CRP 7,486ドル(37%高い)\n・CRP検査の追加コストは、確認検査を減らせた分では相殺できなかった\n・有病率が高い集団ほど、1例あたりのコストは大きく下がる\n\n⚠️限界：地域や検診の枠組み(結核単独か、HIV等も含む統合検診か)でコストは変わりうる。見逃しの少なさとのバランス(費用対効果)は別途の評価が必要。\n\n🌍現場の一言：低資源の現場では「精度を一段上げる」追加検査が、必ずしもコストに見合うとは限らない。まず有病率の高い集団に絞る方が効率的かもしれない。\n\n📄 PLOS Glob Public Health 2026 DOI:10.1371/journal.pgph.0007341\n#国際保健 #グローバルヘルス", "x_href": "https://x.com/intent/post?text=%E3%80%90%E7%B5%90%E6%A0%B8%E3%81%AE%E5%9C%B0%E5%9F%9F%E6%A4%9C%E8%A8%BA%E3%80%81AI%E8%AA%AD%E5%BD%B1%E3%81%A0%E3%81%91%E3%81%AE%E6%96%B9%E3%81%8C%E8%BF%BD%E5%8A%A0%E6%A4%9C%E6%9F%BB%E3%82%88%E3%82%8A%E5%AE%89%E3%81%8F%E8%A6%8B%E3%81%A4%E3%81%91%E3%82%89%E3%82%8C%E3%82%8B%21%3F%E3%80%91%0A%0A%E5%8D%97%E3%82%A2%E3%83%95%E3%83%AA%E3%82%AB%E3%81%A8%E3%83%AC%E3%82%BD%E3%83%88%E3%81%AE%E5%9C%B0%E5%9F%9F%E5%AF%86%E7%9D%80%E5%9E%8B%E3%83%BB%E7%B5%90%E6%A0%B8%E3%82%A2%E3%82%AF%E3%83%86%E3%82%A3%E3%83%96%E3%82%B1%E3%83%BC%E3%82%B9%E3%83%95%E3%82%A1%E3%82%A4%E3%83%B3%E3%83%87%E3%82%A3%E3%83%B3%E3%82%B0%28TB%20TRIAGE%2B%E8%A9%A6%E9%A8%93%E3%80%812022%E3%80%9C2024%E5%B9%B4%29%E3%80%8 から、6つの文脈条件・9つの機序・3つのアウトカムを同定\n・介護者の心構えは「病院からの十分な情報」と「介護者トレーニング」と関連\n・鍵となる機序：死が近いことの適時の認識、家族の意思決定の一致、構造化された申し送り、院内緩和ケアチームの支援\n・結論：成功は情報や手技の移転よりも、患者・家族・医療者のあいだで「不確かさと期待」を扱えるかにかかっていた\n\n⚠️限界：ひとつのプログラムの評価で対照群はない。生きて帰れた事例が対象で、移動中に亡くなった例は含まれない。制度も文化も違い、日本にそのまま当てはめられない。\n\n🏠在宅医の一言：「帰れますか」より「帰ったら何が起こりうるか」。病院側と在宅側が家族に同じ言葉で伝えられているか、申し送りの型を見直したい。\n\n📄 Palliat Med 2026 DOI:10.1177/02692163261485101\n#緩和ケア #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E7%9C%8B%E5%8F%96%E3%82%8A%E7%9B%B4%E5%89%8D%E3%81%AE%E3%80%8C%E5%AE%B6%E3%81%AB%E5%B8%B0%E3%81%99%E3%80%8D%E3%80%81%E6%88%90%E5%90%A6%E3%82%92%E5%88%86%E3%81%91%E3%81%9F%E3%81%AE%E3%81%AF%E6%89%8B%E6%8A%80%E3%81%AE%E5%BC%95%E3%81%8D%E7%B6%99%E3%81%8E%E3%81%A7%E3%81%AF%E3%81%AA%E3%81%8B%E3%81%A3%E3%81%9F%21%3F%E3%80%91%0A%0A%E6%95%B0%E6%97%A5%E4%BB%A5%E5%86%85%E3%81%AB%E4%BA%A1%E3%81%8F%E3%81%AA%E3%82%8B%E3%81%A8%E8%A6%8B%E8%BE%BC%E3%81%BE%E3%82%8C%E3%82%8B%E6%82%A3%E8%80%85%E3%82%92%E7%97%85%E9%99%A2%E3%81%8B%E3%82%89%E8%87%AA%E5%AE%85%E3%81%B8%E5%B8%B0%E3%81%99%E7%B5%B1%E4%B8%80%E6%89%8B%E9%A0%86%E3%80%8CCompassionate%20Discharge%E3%80%8D%E3%82%92%E4%BD%9C%E3%82%8A%E3%80%81%E5%A4%9A%E6%96%BD%E8%A8%AD%E3%81%A7%E3%83%AA%E3%82%A2%E3%83%AA%E3%82%B9%E3%83%88%E8%A9%95%E4%BE%A1%E3%82%92%E8%A1%8C%E3%81%A3%E3%81%9F%E7%A0%94%E7%A9%B6%E3%80%82%0A%0A%E3%83%BB%E5%AF%BE%E8%B1%A1%EF%BC%9A%E7%97%85%E9%99%A2%E3%82%B9%E3%82%BF%E3%83%83%E3%83%9566%E4%BA%BA%E3%80%81%E5%9C%A8%E5%AE%85%E3%83%9B%E3%82%B9%E3%83%94%E3%82%B9%E6%8F%90%E4%BE%9B%E8%80%8548%E4%BA%BA%E3%80%81%E5%AE%B6%E6%97%8F%E4%BB%8B%E8%AD%B7%E8%80%8551%E4%BA%BA%0A%E3%83%BB%E3%82%A2%E3%83%B3%E3%82%B1%E3%83%BC%E3%83%88%E3%83%BB%E6%97%A5%E8%AA%8C%E3%83%BB%E9%9D%A2%E6%8E%A5%E3%81%8B%E3%82%89%E3%80%816%E3%81%A4%E3%81%AE%E6%96%87%E8%84%88%E6%9D%A1%E4%BB%B6%E3%83%BB9%E3%81%A4%E3%81%AE%E6%A9%9F%E5%BA%8F%E3%83%BB3%E3%81%A4%E3%81%AE%E3%82%A2%E3%82%A6%E3%83%88%E3%82%AB%E3%83%A0%E3%82%92%E5%90%8C%E5%AE%9A%0A%E3%83%BB%E4%BB%8B%E8%AD%B7%E8%80%85%E3%81%AE%E5%BF%83%E6%A7%8B%E3%81%88%E3%81%AF% ズが2.60倍!?】\n\nケニア・カカメガ郡の母子保健改革研究のデータで、分娩中の施設間の移動距離と、母体死亡・新生児死亡・死産の関係を調べた研究。\n\n・完全な位置情報のある母親39,052人のうち、1,928人（4.9%）が下位の施設を経てから上位の病院へ移っていた\n・その人たちの中で、移動距離が最も長い群（42〜436km）は、最も短い群（2〜16km）に比べ有害な転帰のオッズが2.60倍（社会人口学的・産科的因子で調整後）\n・低次から高次へ「上向きに」搬送された人だけに絞ることで、重症だから運ばれたという選択バイアスを減らす工夫をしている\n\n⚠️限界：観察研究で、距離以外の要因（搬送手段、紹介元の施設の質、もともとの重症度）が残りうる。受診歴は自己申告。1つの郡のデータで、他地域にそのまま当てはまるとは限らない。\n\n🌍現場の一言：「施設で産めれば安全」ではなく、「急変したとき何kmで届くか」が生死を分ける。日本の離島・へき地の分娩体制を考えるうえでも通じる話。\n\n📄 J Glob Health 2026 DOI:10.7189/jogh.16.04300\n#国際保健 #グローバルヘルス", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%81%8A%E7%94%A3%E3%81%AE%E3%80%8C%E7%A7%BB%E5%8B%95%E8%B7%9D%E9%9B%A2%E3%80%8D%E3%81%8C%E9%95%B7%E3%81%84%E3%81%BB%E3%81%A9%E3%80%81%E6%AF%8D%E3%81%A8%E5%AD%90%E3%81%8C%E4%BA%A1%E3%81%8F%E3%81%AA%E3%82%8B%E3%82%AA%E3%83%83%E3%82%BA%E3%81%8C2.60%E5%80%8D%21%3F%E3%80%91%0A%0A%E3%82%B1%E3%83%8B%E3%82%A2%E3%83%BB%E3%82%AB%E3%82%AB%E3%83%A1%E3%82%AC%E9%83%A1%E3%81%AE%E6%AF%8D%E5%AD%90%E4%BF%9D%E5%81%A5%E6%94%B9%E9%9D%A9%E7%A0%94%E7%A9%B6%E3%81%AE%E3%83%87%E3%83%BC%E3%82%BF%E3%81%A7%E3%80%81%E5%88%86%E5%A8%A9%E4%B8%AD%E3%81%AE%E6%96%BD%E8%A8%AD%E9%96%93%E3%81%AE%E7%A7%BB%E5%8B%95%E8%B7%9D%E9%9B%A2%E3%81%A8%E3%80%81%E6%AF%8D%E4%BD%93%E6%AD%BB%E4%BA%A1%E3%83%BB%E6%96%B0%E7%94%9F%E5%85%90%E6%AD%BB%E4%BA%A1%E3%83%BB%E6%AD%BB%E7%94%A3%E3%81%AE%E9%96%A2%E4%BF%82%E3%82%92%E8%AA%BF%E3%81%B9%E3%81%9F%E7%A0%94%E7%A9%B6%E3%80%82%0A%0A%E3%83%BB%E5%AE%8C%E5%85%A8%E3%81%AA%E4%BD%8D%E7%BD%AE%E6%83%85%E5%A0%B1%E3%81%AE%E3%81%82%E3%82%8B%E6%AF%8D%E8%A6%AA39%2C052%E4%BA%BA%E3%81%AE%E3%81%86%E3%81%A1%E3%80%811%2C928%E4%BA%BA%EF%BC%884.9%25%EF%BC%89%E3%81%8C%E4%B8%8B%E4%BD%8D%E3%81%AE%E6%96%BD%E8%A8%AD%E3%82%92%E7%B5%8C%E3%81%A6%E3%81%8B%E3%82%89%E4%B8%8A%E4%BD%8D%E3%81%AE%E7%97%85%E9%99%A2%E3%81%B8%E7%A7%BB%E3%81%A3%E3%81%A6%E3%81%84%E3%81%9F%0A%E3%83%BB%E3%81%9D%E3%81%AE%E4%BA%BA%E3%81%9F%E3%81%A1%E3%81%AE%E4%B8%AD%E3%81%A7%E3%80%81%E7%A7%BB%E5%8B%95%E8%B7%9D%E9%9B%A2%E3%81%8C%E6%9C%80%E3%82%82%E9%95%B7%E3%81%84%E7%BE%A4%EF%BC%8 rn Med）", "url": "https://pubmed.ncbi.nlm.nih.gov/42760462/"}, {"title": "Implementation factors of group antenatal care in low-resource settings in Tanzania.（PLOS Glob Public Health）", "url": "https://pubmed.ncbi.nlm.nih.gov/42758772/"}, {"title": "Qualitative exploration of women's perceptions of cervical cancer screening in Uganda.（PLOS Glob Public Health）", "url": "https://pubmed.ncbi.nlm.nih.gov/42758761/"}, {"title": "Scaling-up tuberculosis preventive therapy to HIV-negative contacts in Zambia.（PLOS Glob Public Health）", "url": "https://pubmed.ncbi.nlm.nih.gov/42758766/"}]}, "2026-09-20": {"label": "2026-09-20（日）・3本", "posts": [{"id": "2026-09-20-1", "n": 1, "category": "medical", "badges": ["🔍深掘り候補"], "body": "【フレイルな高齢者ほど、高用量インフルワクチンが効く!?】\n\nデンマークの無作為化試験DANFLU-2（65歳以上、約33万人）の事前規定解析。高用量 vs 標準量インフルエンザワクチンで「インフルエンザ・肺炎による入院」を比べ、フレイルリスク（HFRS）別に効果を見た。\n\n・入院率：低フレイル0.5%、中1.5%、高4.2%\n・相対的有効性：低0.2%、中13.1%、高19.9%\n・HFRSを連続量で見ると、フレイルが強いほど効果が高い（交互作用p=0.020）\n・重篤な有害事象の割合は、どのフレイル群でも高用量と標準量で同程度\n\n⚠️限界：事前に決めた3群での比較では交互作用なし（p=0.17）。群ごとの95%CIはすべて0をまたぐ。オープンラベルで、資金はSanofi。著者自身も探索的な結果としている。\n\n🏠在宅医の一言：訪問診療の患者さんの多くは「高フレイル群」。高用量ワクチンを選択肢として話題にする根拠が一つ増えた、くらいの温度感で受け止めたい。\n\n📄 Lancet Healthy Longev 2026 DOI:10.1016/j.lanhl.2026.100894\n#総合内科 #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%83%95%E3%83%AC%E3%82%A4%E3%83%AB%E3%81%AA%E9%AB%98%E9%BD%A2%E8%80%85%E3%81%BB%E3%81%A9%E3%80%81%E9%AB%98%E7%94%A8%E9%87%8F%E3%82%A4%E3%83%B3%E3%83%95%E3%83%AB%E3%83%AF%E3%82%AF%E3%83%81%E3%83%B3%E3%81%8C%E5%8A%B9%E3%81%8F%21%3F%E3%80%91%0A%0A%E3%83%87%E3%83%B3%E3%83%9E%E3%83%BC%E3%82%AF%E3%81%AE%E7%84%A1%E4%BD%9C%E7%82%BA%E5%8C%96%E8%A9%A6%E9%A8%93DANFLU-2%EF%BC%8865%E6%AD%B3%E4%BB%A5%E4%B8%8A%E3%80%81%E7%B4%8433%E4%B8%87%E4%BA%BA%EF%BC%89%E3%81%AE%E4%BA%8B%E5%89%8D%E8%A6%8F%E5%AE%9A%E8%A7%A3%E6%9E%90%E3%80%82%E9%AB%98%E7%94%A8%E9%87%8F%20vs%20%E6%A8%99%E6%BA%96%E9%87%8F%E3%82%A4%E3%83%B3%E3%83%95%E3%83%AB%E3%82%A8%E3%83%B3%E3%82%B6%E3%83%AF%E3%82%AF%E3%83%81%E3%83%B3%E3%81%A7%E3%80% %E6%82%A3%E8%80%85%E3%81%95%E3%82%93%E3%81%AE%E5%A4%9A%E3%81%8F%E3%81%AF%E3%80%8C%E9%AB%98%E3%83%95%E3%83%AC%E3%82%A4%E3%83%AB%E7%BE%A4%E3%80%8D%E3%80%82%E9%AB%98%E7%94%A8%E9%87%8F%E3%83%AF%E3%82%AF%E3%83%81%E3%83%B3%E3%82%92%E9%81%B8%E6%8A%9E%E8%82%A2%E3%81%A8%E3%81%97%E3%81%A6%E8%A9%B1%E9%A1%8C%E3%81%AB%E3%81%99%E3%82%8B%E6%A0%B9%E6%8B%A0%E3%81%8C%E4%B8%80%E3%81%A4%E5%A2%97%E3%81%88%E3%81%9F%E3%80%81%E3%81%8F%E3%82%89%E3%81%84%E3%81%AE%E6%B8%A9%E5%BA%A6%E6%84%9F%E3%81%A7%E5%8F%97%E3%81%91%E6%AD%A2%E3%82%81%E3%81%9F%E3%81%84%E3%80%82%0A%0A%F0%9F%93%84%20Lancet%20Healthy%20Longev%202026%20DOI%3A10.1016%2Fj.lanhl.2026.100894%0A%23%E7%B7%8F%E5%90%88%E5%86%85%E7%A7%91%20%23%E5%9C%A8%E5%AE%85%E5%8C%BB%E7%99%82", "paper_url": "https://doi.org/10.1016/j.lanhl.2026.100894", "figure": null, "why": "フレイル×ワクチンは訪問診療の患者層そのもの。大規模RCTで「強いフレイルほど効く」という意外性"}, {"id": "2026-09-20-2", "n": 2, "category": "medical", "badges": [], "body": "【がん性腹水のCART、延命効果は「ほぼなし」!?】\n\n日本のレセプト全国データ（NDB）で、亡くなる前1年以内に腹水ドレナージを受けたがん患者を解析。最初にCART（腹水濾過濃縮再静注法）を受けた10,654人と、穿刺排液のみの37,272人を比べた。\n\n・全生存期間の中央値：31日 vs 28日（調整HR 0.97、95%CI 0.95–0.99）→ 臨床的に意味のある延命はなし\n・再ドレナージ：調整HR 0.73（95%CI 0.72–0.74）\n・ドレナージの間隔の中央値：15日 vs 8.3日\n・肝細胞がん・肝転移のある人で、再ドレナージの減少がより大きい傾向\n\n⚠️限界：後ろ向きのレセプト研究で、どちらを選んだかの背景（全身状態など）の偏りは残りうる。データは2013〜2016年。評価項目は生存と再ドレナージで、症状やQOLは含まれない。\n\n🏠在宅医の一言：CARTは「命を延ばす治療」ではなく「抜く回数を減らす治療」と説明するのが誠実。通院や入院の負担と、本人の目標に合わせて選びたい。\n\n📄 J Pain Symptom Manage 2026 DOI:10.1016/j.jpainsymman.2026.09.017\n#緩和ケア #在宅医療", "x_href": "https://x.com/intent/post?text=%E3%80%90%E3%81%8C%E3%82%93%E6%80%A7%E8%85%B9%E6%B0%B4%E3%81%AECART%E3%80%81%E5%BB%B6%E5%91%BD%E5%8A%B9%E6%9E%9C%E3%81%AF%E3%80%8C%E3%81%BB%E3%81%BC%E3%81%AA%E3%81%97%E3%80%8D%21%3F%E3%80%91%0A%0A%E6%97%A5%E6%9C%AC%E3%81%AE%E3%83%AC%E3%82%BB%E3%83%97%E3%83%88%E5%85%A8%E5%9B%BD%E3%83%87%E3%83%BC%E3%82%BF%EF%BC%88NDB%EF%BC%89%E3%81%A7%E3%80%81%E4%BA%A1%E3%81%8F%E3%81%AA%E3%82%8B%E5%89%8D1%E5%B9%B4%E4%BB%A5%E5%86%85%E3%81%AB%E8%85%B9%E6%B0%B4%E3%83%89%E3%83%AC%E3%83%8A%E3%8 <script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var DATES = DATA.dates;
  var XBASE = "https://x.com/" + "intent/post?text=";
  var postsById = {};
  var daysEl = document.getElementById("days");
  var selectEl = document.getElementById("date-select");

  function esc(s) {
    var div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }

  function paperLabel(url) {
    return /doi\.org|pubmed/i.test(url) ? "論文" : "記事";
  }

  function renderPost(p) {
    postsById[p.id] = p;
    var badges = (p.badges || []).map(function (b) {
      return '<span class="badge">' + esc(b) + "</span>";
    }).join("");
    var lines = (p.body || "").split("\n");
    var hook = lines[0] || "";
    var rest = lines.slice(1).join("\n").replace(/^\n+/, "");
    var html = '<article class="post cat-' + esc(p.category) + '">';
    if (badges) html += '<div class="badges">' + badges + "</div>";
    if (hook) html += '<p class="hook">' + esc(hook) + "</p>";
    if (rest) html += '<p class="body-text">' + esc(rest) + "</p>";
    html += '<div class="actions">';
    html += '<button type="button" class="primary x-open" data-id="' + esc(p.id) + '">Xで開く</button>';
    if (p.paper_url) {
      html += '<a href="' + esc(p.paper_url) + '" target="_blank" rel="noopener">' + paperLabel(p.paper_url) + "</a>";
    }
    html += "</div>";
    if (p.figure) html += '<p class="meta-line">🖼 ' + esc(p.figure) + "</p>";
    if (p.why) html += '<p class="meta-line">💡 ' + esc(p.why) + "</p>";
    html += "</article>";
    return html;
  }

  function renderHbrBuzz(hbr, date) {
    if (!hbr) return "";
    // Xで開くボタンは既存の投稿と同じ仕組み（postsById + .x-open）を再利用する。
    // body を空にしておくと、クリック時に x_href がそのまま使われる（既存のフォールバックと同じ）。
    var id = date + "-hbr";
    postsById[id] = { id: id, body: "", x_href: hbr.x_href };
    var html = '<article class="hbr-buzz">';
    html += '<div class="badges"><span class="badge">📰 HBRで話題（未読）</span></div>';
    if (hbr.headline) html += '<p class="hook">' + esc(hbr.headline) + "</p>";
    if (hbr.why) html += '<p class="hbr-buzz-why">💡 ' + esc(hbr.why) + "（本文未読）</p>";
    html += '<div class="actions">';
    if (hbr.x_href) {
      html += '<button type="button" class="primary x-open" data-id="' + esc(id) + '">Xで開く</button>';
    }
    if (hbr.url) {
      html += '<a href="' + esc(hbr.url) + '" target="_blank" rel="noopener">記事（未読）</a>';
    }
    html += "</div>";
    html += "</article>";
    return html;
  }

  function renderBig5Reviews(items) {

    // 実際の抄録（結論）と、そのまま論文へ飛べるリンクだけを見せる（投稿ではなく本人の閲覧用）。
    // 番号付きの投稿（読んで分析したもの）と見間違えないよう、見出しのすぐ下に「選ばなかった・本文未読」の注記を置く。
    if (!items || !items.length) return "";
    var cards = items.map(function (r) {
      var html = '<div class="big5-review-item">';
      html += '<p class="hook">' + esc(r.title) + "</p>";
      html += '<p class="meta-line">' + esc(r.journal) + (r.date ? "・" + esc(r.date) : "") + "</p>";
      if (r.conclusion) html += '<p class="conclusion">結論（抄録の抜粋）：' + esc(r.conclusion) + "</p>";
      if (r.url) {
        html += '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">論文を見る（未読）</a>';
      }
      html += "</div>";
      return html;
    }).join("");
    var note = '<p class="big5-reviews-note">きょう選ばなかった論文です。抄録の結論を抜粋しただけで、本文は未読・内容の分析もしていません。</p>';
    return '<section class="big5-reviews"><p class="big5-reviews-title">📚 5大誌の最新レビュー</p>' + note + cards + "</section>";
  }

  function renderRunnersUp(items) {
    if (!items || !items.length) return "";
    var lis = items.map(function (r) {
      return "<li>" + esc(r.title) + ' <a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.url) + "</a></li>";
    }).join("");
    return '<details class="runners-up"><summary>次点（' + items.length + '）</summary><ul>' + lis + "</ul></details>";
  }

  function buildDay(date) {
    var day = DATA.days[date];
    var section = document.createElement("section");
    section.className = "day";
    section.dataset.date = date;
    section.hidden = true;
    var postsHtml = (day.posts.length
      ? day.posts.map(renderPost).join("")
      : "<p>きょうは該当なしでした。</p>");
    section.innerHTML = postsHtml + renderHbrBuzz(day.hbr_buzz, date) + renderBig5Reviews(day.big5_reviews) + renderRunnersUp(day.runners_up);
    daysEl.appendChild(section);
    sections[date] = section;
  }

  DATES.forEach(buildDay);

  function currentIndex() {
    return DATES.indexOf(selectEl.value);
  }

  function showDay(date) {
    if (!sections[date]) return;
    DATES.forEach(function (d) { sections[d].hidden = (d !== date); });
    selectEl.value = date;
    prevBtn.disabled = currentIndex() >= DATES.length - 1;
    nextBtn.disabled = currentIndex() <= 0;
    try { window.localStorage.setItem("iryohee-last-date", date); } catch (e) { /* 無視する */ }
  }

  function initialDate() {
    var stored = null;
    try { stored = window.localStorage.getItem("iryohee-last-date"); } catch (e) { /* 無視する */ }
    if (stored && sections[stored]) return stored;
    return DATES[0];
  }

  selectEl.addEventListener("change", function () { showDay(selectEl.value); });
  prevBtn.addEventListener("click", function () {
    var i = currentIndex();
    if (i < DATES.length - 1) showDay(DATES[i + 1]);
  });
  nextBtn.addEventListener("click", function () {
    var i = currentIndex();
    if (i > 0) showDay(DATES[i - 1]);
  });
  daysEl.addEventListener("click", function (ev) {
    var btn = ev.target.closest(".x-open");
    if (!btn) return;
    var p = postsById[btn.dataset.id];
    if (!p) return;
    var url = p.body ? (XBASE + encodeURIComponent(p.body)) : p.x_href;
    if (url) window.open(url, "_blank", "noopener");
  });

  if (DATES.length) showDay(initialDate());
})();
</script>
</body>
</html>
